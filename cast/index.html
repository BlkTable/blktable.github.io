<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLK Casting — كاستنج</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<style>
  :root {
    --bg: #0a0b0d; --bg-top: #16181c; --card: #131519; --text: #f2f3f5; --muted: #8b9198;
    --silver: #d6dade; --silver-hi: #eef0f2; --silver-lo: #b4b9c0;
    --line: rgba(255,255,255,0.08); --field-bg: #0e1013; --field-border: #2a2e34;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  ::placeholder { color: #5f656d; }
  .wrap { min-height: 100vh; padding: 32px 20px 60px; background: radial-gradient(1200px 600px at 50% -10%, var(--bg-top) 0%, var(--bg) 55%); }
  .sheet { width: 100%; max-width: 480px; margin: 0 auto; }
  .brand-logo { display: block; width: 210px; max-width: 70%; height: auto; margin: 8px auto 20px; }
  .head { text-align: center; margin-bottom: 26px; }
  .head h1 { font-size: 1.3rem; margin: 0 0 6px; font-weight: 800; letter-spacing: 0.02em; }
  .head p { margin: 0; color: var(--muted); font-size: 0.9rem; }
  .card { background: linear-gradient(180deg, #16181d 0%, var(--card) 100%); border: 1px solid var(--line);
    border-radius: 18px; padding: 24px 22px; box-shadow: 0 24px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04); }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 0.82rem; color: var(--text); margin-bottom: 7px; font-weight: 600; }
  label .req { color: var(--silver); }
  label .ar { color: var(--muted); font-weight: 400; }
  input, select { width: 100%; padding: 12px 14px; border-radius: 11px; border: 1px solid var(--field-border);
    background: var(--field-bg); color: var(--text); font-size: 1rem; outline: none; font-family: inherit;
    transition: border-color 0.15s ease, box-shadow 0.15s ease; color-scheme: dark; height: 48px; }
  input:focus, select:focus { border-color: var(--silver); box-shadow: 0 0 0 3px rgba(214,218,222,0.12); }
  textarea { width: 100%; padding: 12px 14px; border-radius: 11px; border: 1px solid var(--field-border);
    background: var(--field-bg); color: var(--text); font-size: 1rem; outline: none; font-family: inherit;
    transition: border-color 0.15s ease, box-shadow 0.15s ease; color-scheme: dark; }
  textarea:focus { border-color: var(--silver); box-shadow: 0 0 0 3px rgba(214,218,222,0.12); }
  textarea.autogrow { min-height: 48px; height: 48px; resize: none; overflow: hidden; line-height: 1.4; }
  textarea.invalid { border-color: #ff6b6b !important; box-shadow: 0 0 0 3px rgba(255,107,107,0.16) !important; }
  input[type="date"] { cursor: pointer; -webkit-appearance: none; appearance: none; min-width: 0; max-width: 100%; }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.85); opacity: 0.85; cursor: pointer; }
  select { appearance: none; -webkit-appearance: none; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
  input.invalid, select.invalid { border-color: #ff6b6b !important; box-shadow: 0 0 0 3px rgba(255,107,107,0.16) !important; }
  .hint { color: var(--muted); font-size: 0.76rem; margin-top: 6px; }

  /* phone */
  .phone-row { display: flex; gap: 10px; align-items: stretch; }
  .phone-row input { flex: 1; }
  .cc-picker { position: relative; flex: 0 0 auto; }
  .cc-btn { display: flex; align-items: center; gap: 8px; height: 100%; padding: 0 12px; border-radius: 11px;
    border: 1px solid var(--field-border); background: var(--field-bg); color: var(--text); font-size: 1rem; cursor: pointer; font-family: inherit; }
  .cc-btn:hover { border-color: var(--silver); }
  .cc-flag, .cc-menu li img { width: 22px; height: 15px; object-fit: cover; border-radius: 2px; display: block; box-shadow: 0 0 0 1px rgba(255,255,255,0.15); background: #333; }
  .cc-caret { color: var(--muted); font-size: 0.7rem; }
  .cc-menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; margin: 0; padding: 6px; list-style: none; min-width: 190px;
    background: #1a1d22; border: 1px solid var(--field-border); border-radius: 12px; box-shadow: 0 18px 40px rgba(0,0,0,0.5); display: none; }
  .cc-menu.open { display: block; }
  .cc-menu li { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; cursor: pointer; }
  .cc-menu li:hover { background: rgba(255,255,255,0.06); }
  .cc-menu li b { margin-left: auto; color: var(--muted); font-weight: 600; }

  /* photo */
  .file-row { display: flex; align-items: center; gap: 12px; }
  .file-btn { padding: 11px 16px; border-radius: 11px; border: 1px solid var(--field-border); background: var(--field-bg); color: var(--text); font-size: 0.9rem; cursor: pointer; white-space: nowrap; }
  .file-btn:hover { border-color: var(--silver); }
  .file-name { color: var(--muted); font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-check { display: none; width: 22px; height: 22px; border-radius: 50%; background: #25d366; color: #0a2e17; font-weight: 800; font-size: 0.78rem; align-items: center; justify-content: center; flex: 0 0 auto; }
  .file-row.invalid .file-btn { border-color: #ff6b6b; box-shadow: 0 0 0 3px rgba(255,107,107,0.16); }
  input[type="file"] { display: none; }

  .submit { width: 100%; margin-top: 22px; padding: 14px 16px; border-radius: 12px; border: none;
    background: linear-gradient(180deg, var(--silver-hi) 0%, var(--silver-lo) 100%); color: #14161a; font-weight: 700; font-size: 1rem; cursor: pointer;
    transition: filter 0.15s ease, transform 0.05s ease; }
  .submit:hover { filter: brightness(1.05); } .submit:active { transform: translateY(1px); } .submit:disabled { opacity: 0.55; cursor: default; filter: none; }
  .form-msg { text-align: center; min-height: 1.2em; margin-top: 12px; font-size: 0.88rem; color: #ff6b6b; }
  .success { display: none; text-align: center; padding: 20px 10px; }
  .success .check { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 18px; border: 2px solid var(--silver);
    display: flex; align-items: center; justify-content: center; font-size: 30px; color: var(--silver); }
  .success h2 { margin: 0 0 8px; font-size: 1.2rem; } .success p { margin: 0; color: var(--muted); font-size: 0.92rem; line-height: 1.5; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sheet">
      <img class="brand-logo" src="../assets/blk-logo.svg" alt="BLK قهوة">
      <div class="head">
        <h1>BLK Casting <span style="color:var(--muted);font-weight:600;">· كاستنج</span></h1>
        <p>Fill in your details below.</p>
      </div>

      <div class="card" id="card">
        <form id="form" novalidate>
          <div class="field">
            <label for="full_name">Name <span class="ar">/ الاسم</span> <span class="req">*</span></label>
            <input type="text" id="full_name" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="dob">Date of birth <span class="ar">/ تاريخ الميلاد</span> <span class="req">*</span></label>
            <input type="date" id="dob" required>
          </div>
          <div class="field">
            <label for="phone_local">Phone number <span class="ar">/ رقم التلفون</span> <span class="req">*</span></label>
            <div class="phone-row">
              <div class="cc-picker" id="cc-picker">
                <button type="button" class="cc-btn" id="cc-btn" aria-haspopup="listbox" aria-expanded="false">
                  <img class="cc-flag" id="cc-flag" alt="">
                  <span id="cc-dial">+962</span>
                  <span class="cc-caret">▾</span>
                </button>
                <ul class="cc-menu" id="cc-menu" role="listbox"></ul>
              </div>
              <input type="tel" id="phone_local" inputmode="numeric" autocomplete="tel-national" required>
            </div>
            <div class="hint">We may contact you on WhatsApp.</div>
          </div>
          <div class="field">
            <label for="branch">Branch <span class="ar">/ الفرع</span> <span class="req">*</span></label>
            <input type="text" id="branch" required>
          </div>
          <div class="field">
            <label for="university">University student? <span class="ar">/ مسجل جامعة؟</span> <span class="req">*</span></label>
            <select id="university" required>
              <option value="">Select… / اختر</option>
              <option value="Yes">Yes / نعم</option>
              <option value="No">No / لا</option>
            </select>
          </div>
          <div class="field">
            <label for="acted">Have you ever acted? <span class="ar">/ هل سبق أن مثّلت؟</span> <span class="req">*</span></label>
            <select id="acted" required>
              <option value="">Select… / اختر</option>
              <option value="Yes">Yes / نعم</option>
              <option value="No">No / لا</option>
            </select>
          </div>
          <div class="field">
            <label>Photo of yourself <span class="ar">/ صورة الك</span> <span class="req">*</span></label>
            <div class="file-row" id="file-row">
              <button type="button" class="file-btn" id="file-btn">Choose photo</button>
              <span class="file-check" id="file-check" aria-hidden="true">✓</span>
              <span class="file-name" id="file-name">No photo chosen</span>
            </div>
            <input type="file" id="photo" accept="image/*">
            <div class="hint">A clear photo of your face — up to 10 MB.</div>
          </div>

          <button type="submit" class="submit" id="submit-btn">Submit</button>
          <div class="form-msg" id="form-msg"></div>
        </form>
      </div>

      <div class="card success" id="success">
        <div class="check">✓</div>
        <h2>Received</h2>
        <p>Thanks! We've got your details and will be in touch.</p>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  var SUPABASE_URL = "https://cisqemycewkqakyqmusw.supabase.co";
  var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpc3FlbXljZXdrcWFreXFtdXN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1NDY1NDEsImV4cCI6MjEwMDEyMjU0MX0.OHvaGhRKB2Pi82UQfyV-Qh7l-ZPx1Gjhz0irDnDSINg";
  var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  var MAX_BYTES = 10 * 1024 * 1024;

  // Removed built-in questions (set by the dashboard editor) are hidden from this form
  var hiddenCols = {};
  var HIDE_MAP = { branch: "branch", university_student: "university", ever_acted: "acted" };
  function applyHidden() {
    Object.keys(hiddenCols).forEach(function (col) {
      var id = HIDE_MAP[col]; if (!id) return;
      var el = document.getElementById(id); if (el) { var f = el.closest ? el.closest(".field") : null; if (f) f.style.display = "none"; }
    });
  }
  db.rpc("get_form_config", { p_key: "casting" }).then(function (res) {
    if (res && !res.error && res.data && res.data.hidden) { res.data.hidden.forEach(function (c) { hiddenCols[c] = true; }); applyHidden(); }
  }).catch(function () {});

  // Rotatable link gate: only blocks when the token is explicitly invalid; any error fails open.
  function getParam(n) { var m = new RegExp("[?&]" + n + "=([^&]+)").exec(location.search); return m ? decodeURIComponent(m[1]) : ""; }
  db.rpc("form_token_valid", { p_key: "casting", p_k: getParam("k") }).then(function (res) {
    if (res && !res.error && res.data === false) {
      var card = document.getElementById("card"); if (card) card.style.display = "none";
      var host = document.querySelector(".sheet") || document.body;
      var m = document.createElement("div"); m.className = "card";
      m.innerHTML = '<div style="text-align:center;padding:14px 6px;"><div style="font-size:1.15rem;font-weight:800;margin-bottom:8px;">This link is no longer active</div><div style="color:var(--muted);line-height:1.5;">Please request the current link or QR code from BLK.</div></div>';
      host.appendChild(m);
    }
  }).catch(function () {});

  function val(id) { return document.getElementById(id).value.trim(); }
  function sanitize(name) { return name.replace(/[^a-zA-Z0-9._-]/g, "_").slice(-80); }
  function markInvalid(id, bad) { var el = document.getElementById(id); if (el) el.classList.toggle("invalid", !!bad); }

  var formEl = document.getElementById("form");
  formEl.addEventListener("input", function (e) { if (e.target && e.target.classList) e.target.classList.remove("invalid"); }, true);
  formEl.addEventListener("change", function (e) { if (e.target && e.target.classList) e.target.classList.remove("invalid"); }, true);

  // Date of birth calendar
  var dobInput = document.getElementById("dob");
  dobInput.addEventListener("click", function () { if (this.showPicker) { try { this.showPicker(); } catch (e) {} } });

  // Phone: custom country picker + digit-limited local number
  var COUNTRIES = [
    { cc: "962", len: [9],    ph: "7X XXX XXXX",  flag: "jo", name: "Jordan" },
    { cc: "961", len: [7, 8], ph: "XX XXX XXX",   flag: "lb", name: "Lebanon" },
    { cc: "963", len: [9],    ph: "9XX XXX XXX",  flag: "sy", name: "Syria" },
    { cc: "964", len: [10],   ph: "7XX XXX XXXX", flag: "iq", name: "Iraq" }
  ];
  var FLAG_BASE = "https://flagcdn.com/";
  function flagUrl(code) { return FLAG_BASE + code + ".svg"; }
  var selCountry = COUNTRIES[0];
  var ccBtn = document.getElementById("cc-btn"), ccMenu = document.getElementById("cc-menu"),
      ccFlag = document.getElementById("cc-flag"), ccDial = document.getElementById("cc-dial"),
      ccPicker = document.getElementById("cc-picker"), phoneLocal = document.getElementById("phone_local");
  function selectCountry(i) {
    selCountry = COUNTRIES[i];
    ccFlag.src = flagUrl(selCountry.flag);
    ccDial.textContent = "+" + selCountry.cc;
    phoneLocal.placeholder = selCountry.ph;
    phoneLocal.maxLength = Math.max.apply(null, selCountry.len) + 1;
  }
  function closeMenu() { ccMenu.classList.remove("open"); ccBtn.setAttribute("aria-expanded", "false"); }
  COUNTRIES.forEach(function (c, i) {
    var li = document.createElement("li");
    li.setAttribute("role", "option");
    li.innerHTML = '<img src="' + flagUrl(c.flag) + '" alt=""> <span>' + c.name + '</span> <b>+' + c.cc + '</b>';
    li.addEventListener("click", function () { selectCountry(i); closeMenu(); });
    ccMenu.appendChild(li);
  });
  ccBtn.addEventListener("click", function (e) { e.stopPropagation(); if (ccMenu.classList.contains("open")) closeMenu(); else { ccMenu.classList.add("open"); ccBtn.setAttribute("aria-expanded", "true"); } });
  document.addEventListener("click", function (e) { if (!ccPicker.contains(e.target)) closeMenu(); });
  phoneLocal.addEventListener("input", function () { phoneLocal.value = phoneLocal.value.replace(/\D/g, ""); });
  selectCountry(0);

  // Photo
  var fileInput = document.getElementById("photo");
  var fileName = document.getElementById("file-name");
  document.getElementById("file-btn").addEventListener("click", function () { fileInput.click(); });
  fileInput.addEventListener("change", function () {
    var has = fileInput.files.length > 0;
    fileName.textContent = has ? fileInput.files[0].name : "No photo chosen";
    document.getElementById("file-check").style.display = has ? "flex" : "none";
    document.getElementById("file-btn").textContent = has ? "Change photo" : "Choose photo";
    if (has) document.getElementById("file-row").classList.remove("invalid");
  });

  formEl.addEventListener("submit", function (e) {
    e.preventDefault();
    var msg = document.getElementById("form-msg");
    var btn = document.getElementById("submit-btn");
    msg.textContent = "";

    var hiddenIds = {}; Object.keys(hiddenCols).forEach(function (c) { if (HIDE_MAP[c]) hiddenIds[HIDE_MAP[c]] = true; });
    var REQUIRED = ["full_name", "dob", "branch", "university", "acted"].filter(function (id) { return !hiddenIds[id]; });
    REQUIRED.forEach(function (id) { markInvalid(id, false); });
    markInvalid("phone_local", false);
    var missing = [];
    REQUIRED.forEach(function (id) { if (!val(id)) { markInvalid(id, true); missing.push(id); } });

    var local = phoneLocal.value.replace(/\D/g, "").replace(/^0+/, "");
    var phoneValid = selCountry.len.indexOf(local.length) !== -1;
    if (!phoneValid) { markInvalid("phone_local", true); missing.push("phone_local"); }

    var fileRow = document.getElementById("file-row");
    var noPhoto = fileInput.files.length === 0;
    fileRow.classList.toggle("invalid", noPhoto);
    if (noPhoto) missing.push("photo");

    if (missing.length) {
      if (missing.length === 1 && missing[0] === "phone_local" && phoneLocal.value) msg.textContent = "Please enter a valid phone number for the selected country.";
      else if (missing.length === 1 && missing[0] === "photo") msg.textContent = "Please add a photo of yourself.";
      else msg.textContent = "Please fill in the highlighted fields.";
      var firstId = missing[0];
      var firstEl = firstId === "photo" ? fileRow : document.getElementById(firstId);
      if (firstEl) { if (firstEl.scrollIntoView) firstEl.scrollIntoView({ behavior: "smooth", block: "center" }); if (firstId !== "photo" && firstEl.focus) firstEl.focus({ preventScroll: true }); }
      return;
    }

    // Admin-defined extra questions
    var extraData = {}, extraMissing = [];
    extraControls.forEach(function (c) {
      c.el.classList.remove("invalid");
      var v = (c.el.value || "").trim();
      if (c.f.required && !v) { c.el.classList.add("invalid"); extraMissing.push(c.el); }
      else if (v !== "") extraData[c.f.id] = v;
    });
    if (extraMissing.length) { msg.textContent = "Please fill in the highlighted fields."; if (extraMissing[0].scrollIntoView) extraMissing[0].scrollIntoView({ behavior: "smooth", block: "center" }); return; }

    var phone = "+" + selCountry.cc + local;
    var file = fileInput.files[0];
    if (file.size > MAX_BYTES) { msg.textContent = "That photo is larger than 10 MB. Please choose a smaller one."; return; }

    btn.disabled = true; btn.textContent = "Submitting…";
    var path = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())) + "_" + sanitize(file.name);
    db.storage.from("photos").upload(path, file, { upsert: false })
      .then(function (res) { if (res.error) throw res.error; return res.data.path; })
      .then(function (photoPath) {
        return db.from("casting_applications").insert({
          full_name: val("full_name"),
          date_of_birth: val("dob") || null,
          phone: phone,
          branch: val("branch") || null,
          university_student: val("university") || null,
          ever_acted: val("acted") || null,
          photo_path: photoPath,
          extra: extraData
        });
      })
      .then(function (res) {
        if (res && res.error) throw res.error;
        document.getElementById("card").style.display = "none";
        document.getElementById("success").style.display = "block";
        window.scrollTo({ top: 0, behavior: "smooth" });
      })
      .catch(function (err) {
        btn.disabled = false; btn.textContent = "Submit";
        msg.textContent = "Sorry, something went wrong. Please try again.";
        if (window.console) console.error(err);
      });
  });

  // ---- Admin-defined extra questions (loaded from the dashboard's table editor) ----
  var extraControls = [];
  function buildExtraField(f) {
    var wrap = document.createElement("div"); wrap.className = "field";
    var lab = document.createElement("label");
    lab.appendChild(document.createTextNode(f.label || ""));
    if (f.label_ar) { var s = document.createElement("span"); s.className = "ar"; s.textContent = " / " + f.label_ar; lab.appendChild(s); }
    if (f.required) { var r = document.createElement("span"); r.className = "req"; r.textContent = " *"; lab.appendChild(r); }
    wrap.appendChild(lab);
    var el;
    if (f.type === "long_text") { el = document.createElement("textarea"); }
    else if (f.type === "yesno" || f.type === "dropdown") {
      el = document.createElement("select");
      var o0 = document.createElement("option"); o0.value = ""; o0.textContent = "Select… / اختر"; el.appendChild(o0);
      var opts = f.type === "yesno" ? [{ en: "Yes", ar: "نعم" }, { en: "No", ar: "لا" }] : (f.options || []);
      opts.forEach(function (o) { var v = typeof o === "string" ? o : o.en; var ar = typeof o === "string" ? "" : (o.ar || ""); var op = document.createElement("option"); op.value = v; op.textContent = v + (ar ? " / " + ar : ""); el.appendChild(op); });
    } else {
      el = document.createElement("input");
      el.type = f.type === "number" ? "number" : (f.type === "date" ? "date" : (f.type === "email" ? "email" : "text"));
    }
    el.id = "extra-" + f.id; wrap.appendChild(el);
    extraControls.push({ f: f, el: el });
    return wrap;
  }
  db.rpc("get_extra_fields", { p_key: "casting" }).then(function (res) {
    if (!res || res.error || !res.data || !res.data.length) return;
    var host = document.createElement("div"); host.id = "extra-fields";
    res.data.forEach(function (f) { host.appendChild(buildExtraField(f)); });
    var submitBtn = document.getElementById("submit-btn");
    submitBtn.parentNode.insertBefore(host, submitBtn);
  }).catch(function () {});

  // Auto-grow: single-line text fields expand with their content instead of hiding it
  (function () {
    function grow(el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }
    [].slice.call(document.querySelectorAll('input[type="text"]')).forEach(function (inp) {
      var ta = document.createElement("textarea");
      ta.id = inp.id; ta.rows = 1; ta.value = inp.value;
      ta.className = (inp.className ? inp.className + " " : "") + "autogrow";
      if (inp.required) ta.required = true;
      if (inp.placeholder) ta.placeholder = inp.placeholder;
      var ac = inp.getAttribute("autocomplete"); if (ac) ta.setAttribute("autocomplete", ac);
      inp.parentNode.replaceChild(ta, inp);
      ta.addEventListener("input", function () { grow(ta); });
      ta.addEventListener("keydown", function (e) { if (e.key === "Enter") e.preventDefault(); });
      grow(ta);
    });
    [].slice.call(document.querySelectorAll("textarea:not(.autogrow)")).forEach(function (ta) {
      ta.classList.add("grow-y");
      ta.addEventListener("input", function () { grow(ta); });
      grow(ta);
    });
  })();
</script>
</body>
</html>
