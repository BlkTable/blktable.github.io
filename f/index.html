<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLK Form</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<style>
  :root {
    --bg: #000000; --bg-2: #0d0d0f; --bg-top: #1a1a1a; --card: #141416; --text: #f2f3f5; --muted: #8b9198;
    --silver: #d6dade; --silver-hi: #eef0f2; --silver-lo: #b4b9c0;
    --line: rgba(255,255,255,0.07); --line-2: rgba(255,255,255,0.14);
    --field-bg: #0d0d0f; --field-border: #2a2a2d;
    --accent: #2d7ff9; --accent-hi: #4f97ff; --pink: #f82b60;
    /* state colours, named where they used to be raw hex */
    --danger: #ff6b6b;
    --gold: #eab308;
    --ok: #7ed08a;
    --wa: #25d366;
    --bg-3: #232326;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  ::placeholder { color: #5f656d; }
  .wrap { min-height: 100vh; padding: 32px 20px 60px; background: var(--bg); }
  .sheet { width: 100%; max-width: 520px; margin: 0 auto; }
  .brand-logo { display: block; width: 210px; max-width: 70%; height: auto; margin: 8px auto 20px; }
  .head { text-align: center; margin-bottom: 26px; }
  .head h1 { font-size: 1.3rem; margin: 0 0 6px; font-weight: 800; letter-spacing: 0.02em; }
  .head p { margin: 0; color: var(--muted); font-size: 0.9rem; }
  .intro { background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 18px; }
  .intro p { margin: 0; color: var(--silver-lo); font-size: 0.92rem; line-height: 1.65; white-space: pre-wrap; }
  .intro p + p { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .intro p.ar { direction: rtl; text-align: right; }
  /* The record this link belongs to — an event's time, location and description. Shown
     above the questions because it is what the person came to read, not part of the form. */
  .pcard { background: rgba(255,255,255,0.03); border: 1px solid var(--line-2); border-radius: 10px;
    padding: 16px 18px; margin-bottom: 18px; }
  .pcard h2 { margin: 0 0 12px; font-size: 1.05rem; font-weight: 700; }
  .pcard dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; }
  .pcard dt { color: var(--muted); font-size: 0.8rem; }
  .pcard dd { margin: 0; font-size: 0.92rem; line-height: 1.5; white-space: pre-wrap; }
  .pcard .slots { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line);
    font-size: 0.9rem; font-weight: 600; color: var(--silver); }
  .pcard .slots.gone { color: var(--gold); }
  .card { background: var(--card); border: 1px solid var(--line-2);
    border-radius: 10px; padding: 24px 22px; }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 0.82rem; color: var(--text); margin-bottom: 7px; font-weight: 600; }
  label .req { color: var(--silver); }
  label .ar { color: var(--muted); font-weight: 400; }
  input, select, textarea { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--field-border);
    background: var(--field-bg); color: var(--text); font-size: 1rem; outline: none; font-family: inherit;
    transition: border-color 0.15s ease, box-shadow 0.15s ease; color-scheme: dark; }
  input:not([type=file]), select { height: 48px; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(45,127,249,0.25); }
  textarea { resize: vertical; min-height: 88px; }
  textarea.autogrow { min-height: 48px; resize: none; overflow: hidden; line-height: 1.4; }
  input[type="date"], input[type="time"] { cursor: pointer; -webkit-appearance: none; appearance: none; min-width: 0; max-width: 100%; }
  input[type="date"]::-webkit-calendar-picker-indicator,
  input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(0.85); opacity: 0.85; cursor: pointer; }
  select { appearance: none; -webkit-appearance: none; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
  input.invalid, select.invalid, textarea.invalid { border-color: var(--danger) !important; box-shadow: 0 0 0 2px rgba(255,107,107,0.3) !important; }
  /* multi-select: tick as many as apply */
  .checks { display: flex; flex-direction: column; gap: 2px; border: 1px solid var(--line);
    border-radius: 10px; padding: 6px; background: var(--card); }
  .checks.invalid { border-color: var(--danger); box-shadow: 0 0 0 2px rgba(255,107,107,0.3); }
  .chk { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px;
    cursor: pointer; font-size: 0.95rem; line-height: 1.35; }
  .chk:hover { background: rgba(255,255,255,0.05); }
  .chk input { width: 17px; height: 17px; flex: 0 0 auto; accent-color: var(--silver); margin: 0; }
  /* searchable dropdown (combobox) */
  .combo { position: relative; }
  .combo-input { padding-right: 34px;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
  .combo.open .combo-input { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(45,127,249,0.25); }
  .combo-list { position: absolute; z-index: 25; left: 0; right: 0; top: calc(100% + 6px); max-height: 264px; overflow-y: auto;
    background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 6px; display: none; }
  .combo.open .combo-list { display: block; }
  .combo-opt { padding: 11px 12px; border-radius: 8px; cursor: pointer; font-size: 0.95rem; }
  .combo-opt.hi, .combo-opt:hover { background: rgba(255,255,255,0.06); }
  .combo-opt.sel { color: var(--silver); font-weight: 600; }
  .combo-empty { padding: 11px 12px; color: var(--muted); font-size: 0.9rem; }
  .hint { color: var(--muted); font-size: 0.76rem; margin-top: 6px; }
  .other-box { margin-top: 8px; }
  .phone-row { display: flex; gap: 10px; align-items: stretch; }
  .phone-row input { flex: 1; }
  .cc-picker { position: relative; flex: 0 0 auto; }
  .cc-btn { display: flex; align-items: center; gap: 8px; height: 100%; padding: 0 12px; border-radius: 8px;
    border: 1px solid var(--field-border); background: var(--field-bg); color: var(--text); font-size: 1rem; cursor: pointer; font-family: inherit; }
  .cc-btn:hover { border-color: var(--line-2); }
  .cc-flag, .cc-menu li img { width: 22px; height: 15px; object-fit: cover; border-radius: 2px; display: block; box-shadow: 0 0 0 1px rgba(255,255,255,0.15); background: #333; }
  .cc-caret { color: var(--muted); font-size: 0.7rem; }
  .cc-menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; margin: 0; padding: 6px; list-style: none; min-width: 190px;
    background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 8px; display: none; }
  .cc-menu.open { display: block; }
  .cc-menu li { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; cursor: pointer; }
  .cc-menu li:hover { background: rgba(255,255,255,0.06); }
  .cc-menu li b { margin-left: auto; color: var(--muted); font-weight: 600; }
  .file-row { display: flex; align-items: center; gap: 12px; }
  .file-btn { padding: 11px 16px; border-radius: 8px; border: 1px solid var(--field-border); background: var(--field-bg); color: var(--text); font-size: 0.9rem; cursor: pointer; white-space: nowrap; }
  .file-btn:hover { border-color: var(--silver); }
  .file-name { color: var(--muted); font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-check { display: none; width: 22px; height: 22px; border-radius: 50%; background: var(--wa); color: #0a2e17; font-weight: 800; font-size: 0.78rem; align-items: center; justify-content: center; flex: 0 0 auto; }
  .file-row.invalid .file-btn { border-color: var(--danger); box-shadow: 0 0 0 2px rgba(255,107,107,0.3); }
  /* One tile per chosen file, so a person can see WHICH photos they attached and take one
     back off. auto-fill rather than a fixed column count: three across on a phone, more on
     a laptop, without a media query. */
  .file-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; margin-top: 10px; }
  .file-tiles:empty { display: none; }
  .file-tile { position: relative; border: 1px solid var(--field-border); border-radius: 8px; background: var(--field-bg); overflow: hidden; }
  .file-tile.invalid { border-color: var(--danger); box-shadow: 0 0 0 2px rgba(255,107,107,0.3); }
  .ft-shot { display: block; width: 100%; height: 92px; object-fit: cover; background: #000; }
  .ft-glyph { display: flex; align-items: center; justify-content: center; height: 92px; color: var(--muted); font-weight: 800; font-size: 0.78rem; letter-spacing: 0.04em; }
  .ft-play { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none;
    width: 30px; height: 30px; border-radius: 50%; background: rgba(0,0,0,0.55); color: #fff; font-size: 0.7rem;
    display: flex; align-items: center; justify-content: center; padding-left: 2px; }
  .ft-cap { padding: 5px 6px; font-size: 0.7rem; color: var(--muted); border-top: 1px solid var(--line);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Big enough to hit with a thumb, and always on top of the picture rather than beside it,
     because on a phone there is no room beside it. */
  .ft-del { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%;
    background: rgba(0,0,0,0.6); color: #fff; font-size: 0.8rem; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center; }
  .ft-del:hover { background: var(--danger); }
  .form-link { display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 8px;
    background: var(--accent); color: #fff; font-weight: 600; font-size: 0.95rem; text-decoration: none;
    transition: background 0.15s ease, transform 0.05s ease; }
  .form-link:hover { background: var(--accent-hi); } .form-link:active { transform: translateY(1px); }
  .form-link .ar { font-weight: 500; opacity: 0.85; }
  .submit { width: 100%; margin-top: 22px; padding: 14px 16px; border-radius: 8px; border: none;
    background: var(--accent); color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease; }
  .submit:hover { background: var(--accent-hi); } .submit:active { transform: translateY(1px); } .submit:disabled { opacity: 0.5; cursor: default; background: var(--accent); }
  .form-msg { text-align: center; min-height: 1.2em; margin-top: 12px; font-size: 0.88rem; color: var(--danger); }
  /* "we kept your answers" — shown only when there were answers to keep */
  .draft-note { display: none; border: 1px solid rgba(126,208,138,0.3); background: rgba(126,208,138,0.07);
    border-radius: 10px; padding: 13px 15px; margin-bottom: 20px; font-size: 0.85rem; line-height: 1.6; color: var(--silver-lo); }
  .draft-note .ar { display: block; direction: rtl; text-align: right; color: var(--muted); }
  .draft-note button { margin-top: 9px; padding: 0; border: none; background: none; font: inherit; font-weight: 600;
    color: var(--accent-hi); cursor: pointer; text-decoration: underline; }
  .success, .notfound { display: none; text-align: center; padding: 20px 10px; }
  .success .check { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 18px; border: 2px solid var(--silver);
    display: flex; align-items: center; justify-content: center; font-size: 30px; color: var(--silver); }
  .success h2, .notfound h2 { margin: 0 0 8px; font-size: 1.2rem; } .success p, .notfound p { margin: 0; color: var(--muted); font-size: 0.92rem; line-height: 1.5; }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sheet">
      <img class="brand-logo" src="../assets/blk-logo.svg" alt="BLK قهوة">
      <div class="head" id="head" style="display:none;"><h1 id="form-title">—</h1></div>
      <div class="intro" id="form-intro" style="display:none;"></div>
      <div class="pcard" id="parent-card" style="display:none;"></div>
      <div class="loading" id="loading">Loading…</div>
      <div class="card" id="card" style="display:none;">
        <form id="form" novalidate>
          <div class="draft-note" id="draft-note">
            <span id="draft-note-en"></span>
            <span class="ar" id="draft-note-ar" dir="rtl"></span>
            <button type="button" id="draft-clear">Start over · ابدأ من جديد</button>
          </div>
          <div id="fields"></div>
          <button type="button" class="submit" id="submit-btn">Submit</button>
          <div class="form-msg" id="form-msg"></div>
        </form>
      </div>
      <div class="card success" id="success"><div class="check">✓</div><h2>Received</h2><p>Thank you! Your submission has been recorded.</p></div>
      <div class="card notfound" id="notfound"><h2>Form not found</h2><p>This form link is invalid or no longer active.</p></div>
      <div class="card notfound" id="closed"><h2 id="closed-h">No places left</h2><p id="closed-p">Every place has been taken.</p></div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3" integrity="sha384-l8ah+VgaWtk1mvOe9VC+OirC6qHFF4yH7l7mKRidV9MSti3E9F463bMp6ZVN4kuC" crossorigin="anonymous"></script>
<script>
  var SUPABASE_URL = "https://db.blktable.blk.jo";
  var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg0NzExNjYwLCJleHAiOjIxMDAwNzE2NjB9.jve2CB0Dt8dESno2dgVHu5kcLnmCE-fISi0TYT_prwc";
  var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ---- File storage: Supabase Storage now, Cloudflare R2 after cutover ----
  // Flip STORAGE_MODE to "r2" at cutover (with SUPABASE_URL/KEY above). Uploads
  // then go through our own `r2` edge function, which keeps the stored path shape
  // identical and means the R2 bucket needs no CORS rule.
  var STORAGE_MODE = "r2";
  function storageUpload(file) {
    if (STORAGE_MODE === "r2") {
      var fd = new FormData();
      fd.append("file", file);
      return fetch(SUPABASE_URL + "/functions/v1/r2/upload", {
        method: "POST",
        headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY },
        body: fd
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (!r.ok) {
            // The status is carried on the error, not only baked into its message, because the
            // difference between "the server is throttling us" and "this file will never be
            // accepted" decides whether waiting and trying again is worth anything.
            var e = new Error(j.error ? j.error + (j.detail ? ": " + j.detail : "") : "upload_failed_" + r.status);
            e.status = r.status;
            e.retryAfterMs = retryAfterMs(r);
            throw e;
          }
          return j.path;
        });
      });
    }
    var path = (window.crypto && crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + "-" + Math.round(Math.random() * 1e9)) + "_" + file.name.replace(/[^a-zA-Z0-9._-]/g, "_").slice(-60);
    return db.storage.from("photos").upload(path, file, { upsert: false })
      .then(function (r) { if (r.error) throw r.error; return r.data.path; });
  }

  // ---- Uploading many photos from one form ----
  // A form can ask for dozens of photos (the shop QC check asks for 52), and the API gateway
  // throttles uploads per IP, where "an IP" is a whole shop behind one office connection. So
  // uploads go up a few at a time, a refusal is waited out rather than surfaced, and a photo
  // that is already stored is never uploaded twice.
  //
  // That last rule is the one that matters most. Firing every photo at once and failing the
  // whole submission on the first refusal made pressing Submit again re-upload everything,
  // refilling the very bucket that had just overflowed, so the form could not recover: on
  // 2026-08-23 one shop pressed Submit through about 1,100 uploads and 262 refusals over eight
  // minutes and not one submission landed.
  var UPLOAD_LANES = 3;
  var UPLOAD_TRIES = 4;
  // A minute bucket is worth waiting out. An hour bucket is not, so the caller is told instead.
  var UPLOAD_MAX_WAIT_MS = 65000;
  function wait(ms) { return new Promise(function (res) { setTimeout(res, ms); }); }
  // How long the server itself says its bucket needs. Its own number beats any guess of ours,
  // and the window is a clock minute rather than a sliding one, so the reset is exact.
  function retryAfterMs(r) {
    var pick = function (name) {
      var v = r && r.headers && r.headers.get ? r.headers.get(name) : null;
      var n = parseInt(v, 10);
      return isFinite(n) && n >= 0 ? n : -1;
    };
    var s = pick("Retry-After");
    if (s < 0) s = pick("RateLimit-Reset");
    if (s < 0) return 0;
    return Math.min(s, UPLOAD_MAX_WAIT_MS / 1000) * 1000;
  }
  // Worth trying again: the server refused because of load, or the upload never arrived. 408
  // is the gateway giving up on a slow body on shop wifi, and a fetch that rejects outright
  // (signal dropped mid-photo) carries no status at all. A 400 or a 413 is a file this form
  // will never accept, and retrying it only makes somebody wait for the same answer.
  function worthRetry(err) {
    var s = err && err.status;
    return !s || s === 408 || s === 425 || s === 429 || (s >= 500 && s < 600);
  }
  function uploadWithRetry(file, tries) {
    return storageUpload(file).catch(function (err) {
      if (tries <= 1 || !worthRetry(err)) throw err;
      // A little jitter on top, so photos queued behind the same refusal do not all come back
      // in the same instant and refuse each other again.
      var base = err && err.retryAfterMs ? err.retryAfterMs : (UPLOAD_TRIES - tries + 1) * 3000;
      return wait(base + Math.round(Math.random() * 800)).then(function () { return uploadWithRetry(file, tries - 1); });
    });
  }
  // A file that is already in the bucket, keyed by the File the person chose. This is what
  // makes a second press of Submit cost only the photos that have not gone up yet, instead of
  // being the thing that keeps the shop over its limit. Weak, so nothing is held once the
  // chosen file itself is gone.
  var UPLOADED = new WeakMap();
  // Runs the chosen files up a few lanes and reports progress as each one lands. Takes
  // { id, file } and returns { id, path } in the order it was given, whichever lane finished
  // first, so a caller can index answers by question id.
  function uploadAll(items, onProgress) {
    var results = [], done = 0, next = 0;
    if (onProgress) onProgress(0, items.length);
    function lane() {
      if (next >= items.length) return Promise.resolve();
      var i = next++, it = items[i], file = it.file;
      // The upload in flight is what is remembered, not the path it ends with, so one photo
      // answering two questions is sent once rather than racing itself.
      var step = UPLOADED.get(file);
      if (!step) {
        step = uploadWithRetry(file, UPLOAD_TRIES);
        UPLOADED.set(file, step);
        // A failure is not remembered: the next press of Submit has to be able to try it
        // again, not replay the same rejection for ever.
        step.catch(function () { UPLOADED.delete(file); });
      }
      return step.then(function (p) {
        results[i] = { id: it.id, path: p };
        if (onProgress) onProgress(++done, items.length);
        return lane();
      });
    }
    var lanes = [];
    for (var n = 0; n < Math.min(UPLOAD_LANES, items.length); n++) lanes.push(lane());
    return Promise.all(lanes).then(function () { return results; });
  }
  // A photo question and a media question have different ceilings, because a video is a
  // different order of size: a phone photo is 2-4 MB, ten seconds of 1080p is 20-30 MB.
  // Both are also enforced in the r2 edge function — this is the copy that can say so
  // BEFORE a person waits through an upload that was never going to be accepted.
  var MAX_BYTES = 10 * 1024 * 1024;
  var MEDIA_MAX_BYTES = 50 * 1024 * 1024;
  // How many files one question takes. The per-file ceiling above was never a limit on the
  // COUNT, and the r2 function is rate limited per IP — a whole shop is one IP — so forty
  // photos off one form is how that limit gets reached by accident. The review app carries
  // the same number: the two must refuse at the same count or one of them is lying.
  var MAX_FILES = 10;
  // ---- One question, more than one file ------------------------------------
  // The same two rules the review app carries, and here for the same reason condMet is
  // duplicated: this page and index.html each read and write upload answers, and a shape
  // only one of them understood would be a form that submits something review cannot show.
  //   filePaths()  reads either shape and always hands back an array
  //   fileValue()  writes one key as a plain string and only several as an array
  // One file stored as a plain string is what keeps every answer written before today —
  // 158,207 records of them — meaning exactly what it meant.
  function filePaths(v) {
    if (v == null || v === "") return [];
    if (Array.isArray(v)) {
      return v.filter(function (p) { return p != null && p !== ""; }).map(String);
    }
    return [String(v)];
  }
  function fileValue(paths) {
    var a = filePaths(paths);
    return !a.length ? null : (a.length === 1 ? a[0] : a);
  }
  // uploadAll returns one {id, path} per FILE, in the order it was given. This puts them back
  // on the questions they answer. Assigning each path straight onto data[id] — which is what
  // the single-file version did — keeps only whichever file landed last, so nine of ten
  // photos would upload successfully and then be thrown away on the way into the row.
  function groupUploads(results) {
    var by = {}, out = {};
    (results || []).forEach(function (r) {
      if (r && r.id) (by[r.id] = by[r.id] || []).push(r.path);
    });
    Object.keys(by).forEach(function (fid) { out[fid] = fileValue(by[fid]); });
    return out;
  }
  // ---- The chosen files, as a list we own ----------------------------------
  // A browser's FileList is read-only: nothing can be taken out of it, and a second pick
  // REPLACES it rather than adding to it. Both of those were visible to the person filling
  // the form as one thing — a photo attached by mistake could not be taken off, and trying

        fchk.style.display = (files.length && !overCap) ? "flex" : "none";
        fbtn.textContent = files.length ? addTxt : pickTxt;
        // Said now rather than after Submit: uploading 80 MB on shop wifi and being refused at
        // the end is the failure worth designing out.
        fhint.textContent = big
          ? (isFile
              ? '"' + big.name + '" is ' + sizeText(big.size) + ". The limit is " + mbText(cap) + " each. Please remove it."
              : '"' + big.name + '" is ' + sizeText(big.size) + ". The limit is " + mbText(cap) + " each." +
                (isVideoFile(big) ? " A shorter clip, or your phone's lower video quality setting, will fit." : " Please remove it."))
          : note || baseHint;
        fhint.style.color = (overCap || noteBad) ? "var(--danger)" : "";
        if (overCap) frow.classList.add("invalid"); else frow.classList.remove("invalid");
        drawTiles();
      }
      fbtn.addEventListener("click", function () { fin.click(); });
      fin.addEventListener("change", function () {
        // The one place the input's own list is read, and only to learn what was just
        // picked. Everything else reads `picked`.
        var justPicked = [].slice.call(fin.files || []);
        var res = addFiles(picked, justPicked, MAX_FILES);
        picked = res.files;
        // Emptied so the same photo can be chosen again after being removed: while the input
        // still holds it, picking it fires no change event at all and nothing happens.
        fin.value = "";
        // Over the cap is a refusal and reads as one. A photo already attached is not a
        // mistake worth colouring red — it is a phone picker handing back a selection that
        // was already ticked — but saying nothing at all looks like the pick did nothing.
        if (res.over) {
          note = MAX_FILES + " " + oneWord + "s at most, so " + res.over + " of them " +
                 (res.over === 1 ? "was" : "were") + " not added.";
          noteBad = true;
        } else if (res.dupes) {
          note = res.dupes === 1 ? "That one is already attached." : "Those are already attached.";
          noteBad = false;
        } else {
          note = ""; noteBad = false;
        }
        refreshFiles();
      });
      controls.push({
        f: f, el: frow, isPhoto: true, cap: cap,
        files: chosenFiles,
        validate: function () { return !overCap && (!f.required || picked.length > 0); },
        badMsg: function () {
          return overCap ? "A " + oneWord + " is larger than " + mbText(cap) + ". Please remove it." : "";
        }
      });
    } else if (f.type === "link") {
      // A read-only button that opens a URL. No answer is collected. Pair with show_if to
      // reveal it only for a given answer (e.g. topic = "Job application"), the way Airtable
      // surfaces a follow-up form link. The URL and button text live in app_fields.options.
      var lo = f.options || {};
      var a = document.createElement("a");
      a.href = lo.url || "#"; a.target = "_blank"; a.rel = "noopener";
      a.className = "form-link";
      a.appendChild(document.createTextNode(lo.text || lo.url || "Open link"));
      if (lo.text_ar) { var s = document.createElement("span"); s.className = "ar"; s.dir = "rtl"; s.textContent = " / " + lo.text_ar; a.appendChild(s); }
      wrap.appendChild(a);
      controls.push({ f: f, el: a, validate: function () { return true; }, value: function () { return null; } });
    } else {
      var inp2 = document.createElement("textarea"); inp2.id = id; inp2.rows = 1; growTextarea(inp2, true); wrap.appendChild(inp2);
      controls.push({ f: f, el: inp2, validate: function () { return !f.required || inp2.value.trim() !== ""; }, value: function () { return inp2.value.trim() || null; },
                      setDraft: function (v) { inp2.value = v; autoGrow(inp2); } });
    }
    // every branch above pushes exactly one control; it owns this wrapper, which is what
    // gets hidden when the question does not apply
    if (controls.length) controls[controls.length - 1].wrap = wrap;
    return wrap;
  }

  function markCtl(ctl, bad) {
    ctl.el.classList.remove("invalid");
    if (ctl.otherEl) ctl.otherEl.classList.remove("invalid");
    if (bad) (ctl.badEl ? ctl.badEl() : ctl.el).classList.add("invalid");
  }

  function init(table, fields) {
    currentTable = table;
    document.getElementById("loading").style.display = "none";
    document.getElementById("form-title").innerHTML = esc(table.name) + (table.name_ar ? ' <span style="color:var(--muted);font-weight:600;">· ' + esc(table.name_ar) + "</span>" : "");
    document.getElementById("head").style.display = "block";
    renderIntro(table.config && table.config.intro);
    document.getElementById("card").style.display = "block";
    var host = document.getElementById("fields");
    fields.filter(function (f) { return !f.internal; }).forEach(function (f) { host.appendChild(buildField(f)); }); // staff-only fields never render publicly

    // Read back before anything is typed, so the page somebody comes back to is the page
    // they left. A file question is named in the note because it is the one answer that
    // cannot be kept, and a person who is not told will press Submit and be sent back.
    draftK = draftKey(slug, parentToken);
    sweepDrafts(Date.now());
    if (restoreAnswers(controls, readDraft(draftK, Date.now()))) {
      showDraftNote(controls.some(function (c) { return c.isPhoto; }));
    }
    [].slice.call(host.querySelectorAll("textarea.autogrow")).forEach(autoGrow);

    var formEl = document.getElementById("form");
    formEl.addEventListener("input", function (e) { if (e.target && e.target.classList) e.target.classList.remove("invalid"); }, true);
    formEl.addEventListener("change", function (e) { if (e.target && e.target.classList) e.target.classList.remove("invalid"); }, true);
    // Any answer can be the one another question waits on, so re-decide on every keystroke.
    // A dropdown settles on blur (the combobox resolves typed text there), which "change"
    // does not cover — hence both, plus focusout.
    ["input", "change", "focusout"].forEach(function (ev) {
      formEl.addEventListener(ev, function () { setTimeout(applyConditions, 0); queueDraftSave(); }, true);
    });
    // The debounce alone would lose the last few keystrokes, and they are the ones that
    // matter: the camera app opening is a phone's cue to discard this tab, and "hidden" is
    // the last event it will deliver before it does. pagehide covers the browsers that skip
    // visibilitychange on the way out.
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") saveDraftNow(); });
    window.addEventListener("pagehide", saveDraftNow);
    var wipe = document.getElementById("draft-clear");
    if (wipe) wipe.addEventListener("click", function (e) {
      e.preventDefault(); clearDraft(draftK); draftK = ""; location.reload();
    });
    applyConditions();
  }

  function submitForm() {
    if (!currentTable) return;
    var msg = document.getElementById("form-msg"); var btn = document.getElementById("submit-btn"); msg.textContent = "";
    var firstBad = null;
    applyConditions();   // decide once, then validate and submit against the same answer
    controls.forEach(function (c) {
      if (!ctlVisible(c)) { markCtl(c, false); return; }   // not asked = nothing to require
      var ok = c.validate(); markCtl(c, !ok); if (!ok && !firstBad) firstBad = c;
    });
    // "Please fill in the highlighted fields" is wrong for a file that is simply too big —
    // nothing is missing, and telling somebody to fill in a question they answered sends them
    // looking for the wrong problem.
    if (firstBad) { msg.textContent = (firstBad.badMsg && firstBad.badMsg()) || "Please fill in the highlighted fields."; if (firstBad.el.scrollIntoView) firstBad.el.scrollIntoView({ behavior: "smooth", block: "center" }); return; }

    btn.disabled = true; btn.textContent = "Submitting…";
    var photoCtls = controls.filter(function (c) { return c.isPhoto && ctlVisible(c) && c.files().length; });
    // Checked before anything is uploaded, not per lane: a file over the ceiling is refused at
    // the end whatever we do, so there is no reason to spend the other uploads first.
    var tooBig = null;
    photoCtls.forEach(function (c) {
      var cap = c.cap || MAX_BYTES;   // a media question allows more than a photo question
      c.files().forEach(function (fl) { if (!tooBig && fl.size > cap) tooBig = { tooBig: true, cap: cap }; });
    });

    // One entry per FILE. uploadAll takes them up three lanes and hands back the paths in the
    // order given, so a question's files come back in the order the person chose them.
    var toUpload = [];
    photoCtls.forEach(function (c) {
      c.files().forEach(function (fl) { toUpload.push({ id: c.f.id, file: fl }); });
    });

    (tooBig ? Promise.reject(tooBig) : uploadAll(toUpload, function (upDone, upTotal) {
      // A phone sending forty photos over shop wifi sits on "Submitting…" for minutes and
      // looks stuck. The count is the difference between waiting and pressing Submit again,
      // and pressing again is what turned a slow submission into one that never landed.
      btn.textContent = (upTotal > 1 && upDone < upTotal)
        ? "Uploading photo " + (upDone + 1) + " of " + upTotal + "…"
        : "Submitting…";
    })).then(function (results) {
      var data = {};
      controls.forEach(function (c) {
        if (c.isPhoto) return;
        // A question that was not asked stores no answer — an answer typed before the
        // gate closed (Yes, then No) must not travel with the submission.
        data[c.f.id] = ctlVisible(c) ? c.value() : null;
        if (c.otherKey && ctlVisible(c)) { var ov = c.otherValue(); if (ov) data[c.otherKey] = ov; }   // free text behind an "other" choice
      });
      var ups = groupUploads(results);
      Object.keys(ups).forEach(function (fid) { data[fid] = ups[fid]; });
      // Submit via SECURITY DEFINER RPC: anon holds no direct table write grant (see 2026-08-09 lockdown). Server resolves the table from the slug and confirms it is a live form.
      // p_token names which parent record this belongs to; the server checks it belongs to
      // this form's parent table, and a parent-scoped form refuses a submission without one.
      //
      // It is sent ONLY when there is one, and that is not tidiness. PostgREST resolves an
      // RPC by the keys in the body: a three-key body against a database that still has the
      // two-argument function resolves to nothing, and every public form's submit fails —
      // the 2026-08-09 outage, in a shape a merge could cause. Sending the same two keys an
      // ordinary form has always sent means this page works before the migration as well as
      // after, so the two can land in either order.
      var payload = { p_slug: slug, p_data: data };
      if (parentToken) payload.p_token = parentToken;
      if (submitDevice) payload.p_device = submitDevice;
      return db.rpc("submit_public_form", payload);
    }).then(function (res) {
      if (res && res.error) throw res.error;
      // The answers are in the database now. Clearing the key as well as the draft stops the
      // page-hide save writing them back on the way out: a shop tablet is one browser used
      // by everybody, and the next person must find an empty form.
      clearDraft(draftK); draftK = "";
      // Which place they took, when the form has capacity. A backup who is told only "thank
      // you" turns up believing they are working.
      var slot = res && res.data && res.data.slot;
      var already = !!(res && res.data && res.data.already);
      var box = document.getElementById("success");
      if (already) {
        // Nothing was written. Saying "received" would be a lie, and saying nothing would
        // leave them wondering whether the second attempt took a second place.
        var al = alreadyText({ slot: slot });
        box.querySelector("h2").textContent = al.head;
        box.querySelector("p").textContent = al.body + " Nothing was added — you still have exactly one place.";
      } else if (slot === "confirmed" || slot === "backup") {
        box.querySelector("h2").textContent = slot === "confirmed" ? "You have a place" : "You are on the backup list";
        box.querySelector("p").textContent = slot === "confirmed"
          ? "Your place is confirmed. The details are in the message above — please keep this link."
          : "Every place is taken, so you are on the backup list. If someone drops out you take their place, and you will be told.";
      }
      document.getElementById("card").style.display = "none";
      document.getElementById("head").style.display = "none";
      document.getElementById("form-intro").style.display = "none";
      document.getElementById("success").style.display = "block";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }).catch(function (err) {
      btn.disabled = false; btn.textContent = "Submit";
      // Never surface the raw database error here — it leaks table names to the public and means nothing to an applicant. Detail goes to the console below.
      // The two exceptions are the ones the person can act on: the last place went while they
      // were filling the form in, or signups closed. Anything else stays generic.
      // `images_only` and `too_large` come from the r2 edge function, and they are the two
      // that say the page and the server disagree — a media question drawn by a page that has
      // been deployed against a function that has not. Naming them means the person is told
      // what to do instead of "try again" on something that will never work.
      var m = String((err && err.message) || "");
      // A throttled or dropped upload is the third thing the person can act on, and the one
      // worth saying plainly: pressing Submit again after a short wait now costs only the
      // photos that have not gone up yet, so telling them to wait is telling them something
      // true. Saying "try again" with no wait is what produced the 2026-08-23 retry storm.
      var upStatus = err && err.status;
      msg.textContent = err && err.tooBig ? "A file is larger than " + mbText(err.cap || MAX_BYTES) + ". Please choose a smaller one."
        : (upStatus === 429 || /upload_failed_429/.test(m)) ? "Too many photos are going up from here at the moment. Wait a minute, then press Submit again: the photos that already uploaded are not sent twice."
        // Only when there were photos: a submission with no upload in it that fails on the
        // network must not be reported as a photo problem.
        : (toUpload.length && (upStatus === 408 || (!upStatus && /upload|fetch|network|load failed/i.test(m)))) ? "A photo stopped uploading, most likely the connection. Press Submit again when the signal is better: the photos that already uploaded are not sent twice."
        : /images_only/i.test(m) ? "Videos can't be uploaded on this form yet. Please choose a photo, or tell whoever sent you this link."
        : /too_large/i.test(m) ? "That file is too large to upload. Please choose a smaller one, or a shorter video."
        : /is full/i.test(m) ? "The last place was taken while you were filling this in. Nothing was submitted."
        : /not open for signups/i.test(m) ? "This has just closed for signups. Nothing was submitted."
        : "Couldn't submit — please try again, or contact us if it keeps happening.";
      if (window.console) console.error(err);
    });
  }
  // Wired once at load; the button is a plain button + explicit preventDefault, so a form can never do a native page-reload submit (the desktop failure).
  (function () {
    var f = document.getElementById("form");
    if (f) f.addEventListener("submit", function (e) { e.preventDefault(); submitForm(); });
    var b = document.getElementById("submit-btn");
    if (b) b.addEventListener("click", function (e) { e.preventDefault(); submitForm(); });
  })();

  function notFound() { document.getElementById("loading").style.display = "none"; document.getElementById("notfound").style.display = "block"; }

  if (!slug) { notFound(); }
  else {
    // Ask for named columns, not "*": the public key may only read what a form needs to
    // draw itself. `config` as a whole carries the review chain, the stage list and the
    // WhatsApp templates, so anon is given `config_public` — intro, colour, icon — instead.
    // An old slug can outlive a rename: a printed QR code points at it forever. A retired slug is
    // kept alive by mapping it here to the form's current slug, and /f/ forwards the visitor. Kept
    // in code, not the DB, on purpose: it is set by hand one line at a time, and Regenerating a
    // form to a fresh random slug leaves the mapped target dead, so a rotated-away QR stops working
    // (which is the point of Regenerate). config_public cannot hold this: it is a generated column.
    var SLUG_FORWARDS = { "franchise-syria-0ha2": "franchise-apply" };
    function resolveAliasOrNotFound() {
      var to = SLUG_FORWARDS[slug];
      if (to && to !== slug) {
        location.replace("/f/?t=" + encodeURIComponent(to) + (parentToken ? "&e=" + encodeURIComponent(parentToken) : ""));
      } else { notFound(); }
    }
    db.from("app_tables").select("id,name,name_ar,slug,is_active,kind,config_public").eq("slug", slug).eq("is_active", true).single().then(function (tRes) {
      if (tRes.error || !tRes.data) { resolveAliasOrNotFound(); return; }
      var table = tRes.data;
      table.config = table.config_public || {};
      // A parent-scoped form is not a form on its own. Without a token — or with one that
      // does not belong to this form's parent table — there is no event to sign up to, so
      // the page says "not found" rather than showing questions that cannot be submitted.
      // config_public carries a marker only — {"scoped": true} — because which record this
      // link names is settled server-side against the token, not in the page.
      var scoped = !!(table.config.parent && table.config.parent.scoped);
      var parentReady = scoped
        ? db.rpc("get_parent_details", { p_slug: slug, p_token: parentToken || null })
            .then(function (r) { return (r && !r.error && r.data) ? r.data : null; })
            .catch(function () { return null; })
        : Promise.resolve(null);
      // form_slots is asked at the same time, not after: the page must not draw a form for a
      // full event and then take it away. It returns counts only, never who signed up.
      var slotsReady = scoped
        ? db.rpc("form_slots", { p_slug: slug, p_token: parentToken || null })
            .then(function (r) { return (r && !r.error && r.data) ? r.data : null; })
            .catch(function () { return null; })
        : Promise.resolve(null);
      // Only sent to a form that says it is one-per-browser. A key sent to a database that
      // has not been migrated is an RPC call PostgREST cannot resolve and a dead submit
      // button — the same trap the token had, so the same rule: never send what the form has
      // not declared it takes.
      var onePer = !!(table.config && table.config.one_per_device);
      var myKey = onePer ? deviceKey() : null;
      submitDevice = myKey;
      var mineReady = (onePer && myKey)
        ? db.rpc("my_signup", { p_slug: slug, p_token: parentToken || null, p_device: myKey })
            .then(function (r) { return (r && !r.error && r.data) ? r.data : null; })
            .catch(function () { return null; })
        : Promise.resolve(null);
      Promise.all([parentReady, slotsReady, mineReady]).then(function (both) {
        var parent = both[0], slots = both[1], mine = both[2];
        if (scoped && !parent) {
          // The slug is real, but this is a per-event form opened without (or with a stale)
          // event token. Say so, rather than the generic "form not found" that reads as if the
          // whole form is gone — the person needs the specific event's link, not this one.
          document.getElementById("loading").style.display = "none";
          var nf = document.getElementById("notfound");
          nf.innerHTML = '<h2>This link needs an event code</h2><p>This form is filled per event, so it needs the specific event’s link. Please ask BLK for the link to the event you mean.</p>';
          nf.style.display = "block";
          return;
        }
        if (parent) parent.slots = slots;
        // Where you stand comes before everything else, including "full": somebody who
        // already has a place must never be shown a form or told there is no room.
        var al = alreadyText(mine);
        if (al) {
          document.getElementById("form-title").innerHTML = esc(table.name);
          document.getElementById("head").style.display = "block";
          if (parent) renderParent(parent);
          showClosed(al.head, al.body);
          return;
        }
        var fieldsReady = db.from("app_fields").select("*").eq("table_id", table.id).order("position", { ascending: true });
        var branchesReady = db.from("branches").select("name,name_ar,position,list_key,is_active").order("position", { ascending: true }).then(function (r) { BRANCHES = (r && !r.error && r.data) ? r.data : []; }).catch(function () { return null; });
        // Names the country a branch list belongs to, for a question offering several of
        // them. Never blocks the form: a failure leaves the list keys as their own labels.
        var countriesReady = db.from("countries").select("code,name_en,name_ar").then(function (r) { COUNTRY_ROWS = (r && !r.error && r.data) ? r.data : []; }).catch(function () { return null; });
        // The choices for a `record_multi` question. Fetched with the branches and the
        // countries rather than after the field list, because it rides the same round
        // trip — and like them it NEVER blocks the form: a database that does not have
        // ballot_options yet must still render every other question, so the page and
        // the migration can land in either order. Same rule as p_token and p_device.
        // p_token names the POLL this link is for, and it decides which events the
        // ballot offers. Sent only when there is one — the same rule the submit uses:
        // PostgREST resolves a function by the keys in the body, so a page that always
        // sent two keys would break against a database that still had the one-argument
        // version. The argument is defaulted server-side, so both shapes resolve.
        var ballotPayload = { p_slug: slug };
        if (parentToken) ballotPayload.p_token = parentToken;
        var ballotReady = db.rpc("ballot_options", ballotPayload)
          .then(function (r) { BALLOT = (r && !r.error && Array.isArray(r.data)) ? r.data : []; })
          .catch(function () { BALLOT = []; });
        Promise.all([fieldsReady, branchesReady, countriesReady, ballotReady]).then(function (results) {
          var fRes = results[0];
          if (fRes.error) { notFound(); return; }
          var st = slotsText(slots);
          if (st && st.blocked) {
            // The details still show: somebody who arrives late should see WHICH event they
            // missed, not a bare refusal.
            document.getElementById("form-title").innerHTML = esc(table.name);
            document.getElementById("head").style.display = "block";
            renderParent(parent);
            showClosed(slots && !slots.open ? "Not open for signups" : "No places left",
              slots && !slots.open
                ? "This is not taking signups at the moment. Please check with whoever sent you the link."
                : "Every place, including the backup places, has been taken.");
            return;
          }
          init(table, fRes.data || []);
          if (parent) renderParent(parent);
        });
      });
    });
  }
</script>
</body>
</html>
