<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLK Form</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<style>
  :root {
    --bg: #000000; --bg-2: #0d0d0f; --bg-top: #1a1a1a; --card: #141416; --text: #f2f3f5; --muted: #8b9198;
    --silver: #d6dade; --silver-hi: #eef0f2; --silver-lo: #b4b9c0;
    --line: rgba(255,255,255,0.07); --line-2: rgba(255,255,255,0.14);
    --field-bg: #0d0d0f; --field-border: #2a2a2d;
    --accent: #2d7ff9; --accent-hi: #4f97ff; --pink: #f82b60;
    /* state colours, named where they used to be raw hex */
    --danger: #ff6b6b;
    --gold: #eab308;
    --ok: #7ed08a;
    --wa: #25d366;
    --bg-3: #232326;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  ::placeholder { color: #5f656d; }
  .wrap { min-height: 100vh; padding: 32px 20px 60px; background: var(--bg); }
  .sheet { width: 100%; max-width: 520px; margin: 0 auto; }
  .brand-logo { display: block; width: 210px; max-width: 70%; height: auto; margin: 8px auto 20px; }
  .head { text-align: center; margin-bottom: 26px; }
  .head h1 { font-size: 1.3rem; margin: 0 0 6px; font-weight: 800; letter-spacing: 0.02em; }
  .head p { margin: 0; color: var(--muted); font-size: 0.9rem; }
  .intro { background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 18px; }
  .intro p { margin: 0; color: var(--silver-lo); font-size: 0.92rem; line-height: 1.65; white-space: pre-wrap; }
  .intro p + p { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .intro p.ar { direction: rtl; text-align: right; }
  /* The record this link belongs to — an event's time, location and description. Shown
     above the questions because it is what the person came to read, not part of the form. */
  .pcard { background: rgba(255,255,255,0.03); border: 1px solid var(--line-2); border-radius: 10px;
    padding: 16px 18px; margin-bottom: 18px; }
  .pcard h2 { margin: 0 0 12px; font-size: 1.05rem; font-weight: 700; }
  .pcard dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; }
  .pcard dt { color: var(--muted); font-size: 0.8rem; }
  .pcard dd { margin: 0; font-size: 0.92rem; line-height: 1.5; white-space: pre-wrap; }
  .pcard .slots { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line);
    font-size: 0.9rem; font-weight: 600; color: var(--silver); }
  .pcard .slots.gone { color: var(--gold); }
  .card { background: var(--card); border: 1px solid var(--line-2);
    border-radius: 10px; padding: 24px 22px; }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 0.82rem; color: var(--text); margin-bottom: 7px; font-weight: 600; }
  label .req { color: var(--silver); }
  label .ar { color: var(--muted); font-weight: 400; }
  input, select, textarea { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--field-border);
    background: var(--field-bg); color: var(--text); font-size: 1rem; outline: none; font-family: inherit;
    transition: border-color 0.15s ease, box-shadow 0.15s ease; color-scheme: dark; }
  input:not([type=file]), select { height: 48px; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(45,127,249,0.25); }
  textarea { resize: vertical; min-height: 88px; }
  textarea.autogrow { min-height: 48px; resize: none; overflow: hidden; line-height: 1.4; }
  input[type="date"], input[type="time"] { cursor: pointer; -webkit-appearance: none; appearance: none; min-width: 0; max-width: 100%; }
  input[type="date"]::-webkit-calendar-picker-indicator,
  input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(0.85); opacity: 0.85; cursor: pointer; }
  select { appearance: none; -webkit-appearance: none; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
  input.invalid, select.invalid, textarea.invalid { border-color: var(--danger) !important; box-shadow: 0 0 0 2px rgba(255,107,107,0.3) !important; }
  /* multi-select: tick as many as apply */
  .checks { display: flex; flex-direction: column; gap: 2px; border: 1px solid var(--line);
    border-radius: 10px; padding: 6px; background: var(--card); }
  .checks.invalid { border-color: var(--danger); box-shadow: 0 0 0 2px rgba(255,107,107,0.3); }
  .chk { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px;
    cursor: pointer; font-size: 0.95rem; line-height: 1.35; }
  .chk:hover { background: rgba(255,255,255,0.05); }
  .chk input { width: 17px; height: 17px; flex: 0 0 auto; accent-color: var(--silver); margin: 0; }
  /* searchable dropdown (combobox) */
  .combo { position: relative; }
  .combo-input { padding-right: 34px;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
  .combo.open .combo-input { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(45,127,249,0.25); }
  .combo-list { position: absolute; z-index: 25; left: 0; right: 0; top: calc(100% + 6px); max-height: 264px; overflow-y: auto;
    background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 6px; display: none; }
  .combo.open .combo-list { display: block; }
  .combo-opt { padding: 11px 12px; border-radius: 8px; cursor: pointer; font-size: 0.95rem; }
  .combo-opt.hi, .combo-opt:hover { background: rgba(255,255,255,0.06); }
  .combo-opt.sel { color: var(--silver); font-weight: 600; }
  .combo-empty { padding: 11px 12px; color: var(--muted); font-size: 0.9rem; }
  .hint { color: var(--muted); font-size: 0.76rem; margin-top: 6px; }
  .other-box { margin-top: 8px; }
  .phone-row { display: flex; gap: 10px; align-items: stretch; }
  .phone-row input { flex: 1; }
  .cc-picker { position: relative; flex: 0 0 auto; }
  .cc-btn { display: flex; align-items: center; gap: 8px; height: 100%; padding: 0 12px; border-radius: 8px;
    border: 1px solid var(--field-border); background: var(--field-bg); color: var(--text); font-size: 1rem; cursor: pointer; font-family: inherit; }
  .cc-btn:hover { border-color: var(--line-2); }
  .cc-flag, .cc-menu li img { width: 22px; height: 15px; object-fit: cover; border-radius: 2px; display: block; box-shadow: 0 0 0 1px rgba(255,255,255,0.15); background: #333; }
  .cc-caret { color: var(--muted); font-size: 0.7rem; }
  .cc-menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; margin: 0; padding: 6px; list-style: none; min-width: 190px;
    background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 8px; display: none; }
  .cc-menu.open { display: block; }
  .cc-menu li { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; cursor: pointer; }
  .cc-menu li:hover { background: rgba(255,255,255,0.06); }
  .cc-menu li b { margin-left: auto; color: var(--muted); font-weight: 600; }
  .file-row { display: flex; align-items: center; gap: 12px; }
  .file-btn { padding: 11px 16px; border-radius: 8px; border: 1px solid var(--field-border); background: var(--field-bg); color: var(--text); font-size: 0.9rem; cursor: pointer; white-space: nowrap; }
  .file-btn:hover { border-color: var(--silver); }
  .file-name { color: var(--muted); font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-check { display: none; width: 22px; height: 22px; border-radius: 50%; background: var(--wa); color: #0a2e17; font-weight: 800; font-size: 0.78rem; align-items: center; justify-content: center; flex: 0 0 auto; }
  .file-row.invalid .file-btn { border-color: var(--danger); box-shadow: 0 0 0 2px rgba(255,107,107,0.3); }
  .submit { width: 100%; margin-top: 22px; padding: 14px 16px; border-radius: 8px; border: none;
    background: var(--accent); color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease; }
  .submit:hover { background: var(--accent-hi); } .submit:active { transform: translateY(1px); } .submit:disabled { opacity: 0.5; cursor: default; background: var(--accent); }
  .form-msg { text-align: center; min-height: 1.2em; margin-top: 12px; font-size: 0.88rem; color: var(--danger); }
  .success, .notfound { display: none; text-align: center; padding: 20px 10px; }
  .success .check { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 18px; border: 2px solid var(--silver);
    display: flex; align-items: center; justify-content: center; font-size: 30px; color: var(--silver); }
  .success h2, .notfound h2 { margin: 0 0 8px; font-size: 1.2rem; } .success p, .notfound p { margin: 0; color: var(--muted); font-size: 0.92rem; line-height: 1.5; }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sheet">
      <img class="brand-logo" src="../assets/blk-logo.svg" alt="BLK قهوة">
      <div class="head" id="head" style="display:none;"><h1 id="form-title">—</h1></div>
      <div class="intro" id="form-intro" style="display:none;"></div>
      <div class="pcard" id="parent-card" style="display:none;"></div>
      <div class="loading" id="loading">Loading…</div>
      <div class="card" id="card" style="display:none;">
        <form id="form" novalidate>
          <div id="fields"></div>
          <button type="button" class="submit" id="submit-btn">Submit</button>
          <div class="form-msg" id="form-msg"></div>
        </form>
      </div>
      <div class="card success" id="success"><div class="check">✓</div><h2>Received</h2><p>Thank you! Your submission has been recorded.</p></div>
      <div class="card notfound" id="notfound"><h2>Form not found</h2><p>This form link is invalid or no longer active.</p></div>
      <div class="card notfound" id="closed"><h2 id="closed-h">No places left</h2><p id="closed-p">Every place has been taken.</p></div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3" integrity="sha384-l8ah+VgaWtk1mvOe9VC+OirC6qHFF4yH7l7mKRidV9MSti3E9F463bMp6ZVN4kuC" crossorigin="anonymous"></script>
<script>
  var SUPABASE_URL = "https://db.blktable.blk.jo";
  var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg0NzExNjYwLCJleHAiOjIxMDAwNzE2NjB9.jve2CB0Dt8dESno2dgVHu5kcLnmCE-fISi0TYT_prwc";
  var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ---- File storage: Supabase Storage now, Cloudflare R2 after cutover ----
  // Flip STORAGE_MODE to "r2" at cutover (with SUPABASE_URL/KEY above). Uploads
  // then go through our own `r2` edge function, which keeps the stored path shape
  // identical and means the R2 bucket needs no CORS rule.
  var STORAGE_MODE = "r2";
  function storageUpload(file) {
    if (STORAGE_MODE === "r2") {
      var fd = new FormData();
      fd.append("file", file);
      return fetch(SUPABASE_URL + "/functions/v1/r2/upload", {
        method: "POST",
        headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY },
        body: fd
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (!r.ok) throw new Error(j.error ? j.error + (j.detail ? ": " + j.detail : "") : "upload_failed_" + r.status);
          return j.path;
        });
      });
    }
    var path = (window.crypto && crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + "-" + Math.round(Math.random() * 1e9)) + "_" + file.name.replace(/[^a-zA-Z0-9._-]/g, "_").slice(-60);
    return db.storage.from("photos").upload(path, file, { upsert: false })
      .then(function (r) { if (r.error) throw r.error; return r.data.path; });
  }
  // A photo question and a media question have different ceilings, because a video is a
  // different order of size: a phone photo is 2-4 MB, ten seconds of 1080p is 20-30 MB.
  // Both are also enforced in the r2 edge function — this is the copy that can say so
  // BEFORE a person waits through an upload that was never going to be accepted.
  var MAX_BYTES = 10 * 1024 * 1024;
  var MEDIA_MAX_BYTES = 50 * 1024 * 1024;
  function isVideoFile(f) { return !!(f && /^video\//.test(f.type || "")); }
  function mbText(b) { return Math.round(b / 1048576) + " MB"; }
  function sizeText(b) {
    if (!(b > 0)) return "0 KB";
    if (b < 1048576) return Math.max(1, Math.round(b / 1024)) + " KB";
    var mb = b / 1048576;
    return (mb >= 10 ? Math.round(mb) : mb.toFixed(1)) + " MB";
  }

  var COUNTRIES = [
    { cc: "962", len: [9],    ph: "7X XXX XXXX",  flag: "jo", name: "Jordan" },
    { cc: "961", len: [7, 8], ph: "XX XXX XXX",   flag: "lb", name: "Lebanon" },
    { cc: "963", len: [9],    ph: "9XX XXX XXX",  flag: "sy", name: "Syria" },
    { cc: "964", len: [10],   ph: "7XX XXX XXXX", flag: "iq", name: "Iraq" }
  ];
  function flagUrl(c) { return "https://flagcdn.com/" + c + ".svg"; }
  function esc(s) { return (s == null ? "" : String(s)).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function getParam(n) { var m = new RegExp("[?&]" + n + "=([^&]+)").exec(location.search); return m ? decodeURIComponent(m[1]) : ""; }

  var slug = getParam("t");
  // A parent-scoped form is opened from a link that names one record of another table —
  // /f/?t=event-signup&e=<token> is the signup form for ONE event. The token is the whole
  // handle: nothing about the parent record is readable without it.
  var parentToken = getParam("e");

  // ---- One submission per browser (opt-in per form) --------------------------
  // A random id this browser mints once and keeps. Deliberately NOT the server's `device`
  // column, which is the User-Agent string and identical across every iPhone on one iOS
  // version — a uniqueness rule on that would refuse the second barista with the same phone
  // model, which at an event where a group signs up together is most of them.
  //
  // Returns null when the browser has no storage to offer (private mode in some browsers,
  // storage disabled, an embedded webview). That is deliberate: with no key the form behaves
  // exactly as it always did and accepts the submission. Refusing a real person because their
  // browser will not remember anything is a worse failure than accepting a duplicate.
  var DEVICE_STORE = "blk_device";
  function deviceKey() {
    try {
      var k = window.localStorage.getItem(DEVICE_STORE);
      if (!k) {
        k = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
          : String(Date.now()) + "-" + Math.random().toString(36).slice(2);
        window.localStorage.setItem(DEVICE_STORE, k);
      }
      return k;
    } catch (e) { return null; }
  }
  var controls = []; // {f, wrap, validate(), value(), isPhoto, file()}
  var currentTable = null;
  var submitDevice = null;   // set once the form declares it is one-per-browser
  var visible = {};  // field id -> is this question being asked right now

  // ---- Conditional questions (every table, current and future) --------------
  // app_fields.show_if = {field: "<other field id>", equals: ["Yes"]} asks this
  // question only when that answer matches. Absent — which is every field written
  // before this existed — means always asked, so nothing changes for older forms.
  function condMet(f, data) {
    var c = f && f.show_if;
    if (!c || !c.field) return true;
    var v = data ? data[c.field] : null;
    v = (v == null ? "" : String(v));
    var want = c.equals;
    if (want == null) return v !== "";                       // no list = "answered at all"
    if (!Array.isArray(want)) want = [want];
    for (var i = 0; i < want.length; i++) if (String(want[i]) === v) return true;
    return false;
  }
  // A question behind a question behind a question: a field whose controller is itself
  // hidden contributes no answer, so it hides too. Settles in a couple of passes.
  function computeVisible() {
    var vis = {};
    controls.forEach(function (c) { vis[c.f.id] = true; });
    for (var pass = 0; pass < 8; pass++) {
      var data = {};
      controls.forEach(function (c) { data[c.f.id] = (vis[c.f.id] && c.value) ? c.value() : null; });
      var changed = false;
      controls.forEach(function (c) {
        var v = condMet(c.f, data);
        if (v !== vis[c.f.id]) { vis[c.f.id] = v; changed = true; }
      });
      if (!changed) break;
    }
    return vis;
  }
  function applyConditions() {
    visible = computeVisible();
    controls.forEach(function (c) {
      if (!c.wrap) return;
      var on = visible[c.f.id] !== false;
      c.wrap.style.display = on ? "" : "none";
      if (!on) markCtl(c, false);   // a hidden question is never the one to fix
    });
  }
  function ctlVisible(c) { return visible[c.f.id] !== false; }

  function labelHtml(f) {
    var ar = f.label_ar ? ' <span class="ar">/ ' + esc(f.label_ar) + '</span>' : "";
    var req = f.required ? ' <span class="req">*</span>' : "";
    return esc(f.label) + ar + req;
  }

  // Optional bilingual intro shown under the title, from app_tables.config.intro = {en, ar}.
  function renderIntro(intro) {
    var box = document.getElementById("form-intro"); if (!box) return;
    var en = (intro && intro.en || "").trim(), ar = (intro && intro.ar || "").trim();
    if (!en && !ar) { box.style.display = "none"; return; }
    box.innerHTML = (en ? "<p>" + esc(en) + "</p>" : "") + (ar ? '<p class="ar" dir="rtl">' + esc(ar) + "</p>" : "");
    box.style.display = "block";
  }

  // What this link's record says: only the fields the table's config.parent.show names,
  // which is all the server will hand out. A date is shown the way a person reads one.
  function fmtParentValue(row) {
    var v = row && row.value == null ? "" : String(row.value);
    var m = (row && (row.type === "date" || row.type === "dob")) ? /^(\d{4})-(\d{2})-(\d{2})/.exec(v) : null;
    if (m) {
      var y = +m[1], mo = +m[2], da = +m[3];
      var d = new Date(y, mo - 1, da);
      // A date JavaScript had to roll over is not a date: new Date(2026, 1, 31) is the 3rd of
      // March, and telling somebody an event is on the 3rd because the 31st of February was
      // typed is worse than showing them what was actually recorded.
      if (!isNaN(d) && d.getFullYear() === y && d.getMonth() === mo - 1 && d.getDate() === da) {
        return d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
      }
    }
    return v;
  }
  // How many places are left, in words. The server hands over counts only — never who
  // signed up — so this is all the page knows and all it needs to know.
  //   {limited:false}            a form with no capacity declared: say nothing
  //   open:false                 not taking signups yet, or over
  //   full:true                  every real and backup place gone
  //   taken < slots              real places left
  //   otherwise                  real places gone, backup places left
  function slotsText(s) {
    if (!s || !s.limited) return null;
    if (!s.open) return { text: "This is not open for signups.", blocked: true, gone: true };
    if (s.full) return { text: "Every place has been taken.", blocked: true, gone: true };
    var slots = s.slots || 0, taken = s.taken || 0, backup = s.backup || 0, waiting = s.waiting || 0;
    var left = slots - taken;
    if (left > 0) {
      return { text: left === 1 ? "1 place left of " + slots : left + " places left of " + slots,
               blocked: false, gone: false };
    }
    // Clamped, and full when nothing is left either way, rather than trusting the flag: a
    // capacity edited down below what is already booked would otherwise offer "-1 backup
    // places". No real place and no backup place is full, whatever else was reported.
    var bleft = Math.max(0, backup - waiting);
    if (bleft === 0) return { text: "Every place has been taken.", blocked: true, gone: true };
    // "8 places taken" and then a backup place is not a rejection — say plainly that this is
    // the reserve list, or somebody signs up believing they are in.
    return { text: "All " + slots + " places are taken. " +
                   (bleft === 1 ? "1 backup place left" : bleft + " backup places left") +
                   " — you would be on the backup list.",
             blocked: false, gone: true };
  }
  // What to say to a browser that already has a place here. Re-opening the link is how
  // somebody checks where they stand, now that there is no cancel button to press.
  function alreadyText(mine) {
    if (!mine) return null;
    if (mine.slot === "confirmed") {
      return { head: "You already have a place",
               body: "This link is already signed up from this phone, and your place is confirmed. If you cannot make it, contact Faisal or Waleed so they can give the place to someone else." };
    }
    if (mine.slot === "backup") {
      return { head: "You are already on the backup list",
               body: "This link is already signed up from this phone. Every place was taken, so you are on the backup list — if someone drops out you take their place, and you will be told." };
    }
    return { head: "You have already signed up",
             body: "This link is already signed up from this phone." };
  }
  function showClosed(head, body) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("card").style.display = "none";
    document.getElementById("closed-h").textContent = head;
    document.getElementById("closed-p").textContent = body;
    document.getElementById("closed").style.display = "block";
  }

  function renderParent(p) {
    var box = document.getElementById("parent-card"); if (!box) return;
    var rows = (p && p.rows) || [];
    if (!(p && p.title) && !rows.length) { box.style.display = "none"; return; }
    var st = slotsText(p.slots);
    box.innerHTML = (p.title ? "<h2>" + esc(p.title) + "</h2>" : "") +
      (rows.length ? "<dl>" + rows.map(function (r) {
        return "<dt>" + esc(r.label) + "</dt><dd>" + esc(fmtParentValue(r)) + "</dd>";

      // form_slots is asked at the same time, not after: the page must not draw a form for a
      // full event and then take it away. It returns counts only, never who signed up.
      var slotsReady = scoped
        ? db.rpc("form_slots", { p_slug: slug, p_token: parentToken || null })
            .then(function (r) { return (r && !r.error && r.data) ? r.data : null; })
            .catch(function () { return null; })
        : Promise.resolve(null);
      // Only sent to a form that says it is one-per-browser. A key sent to a database that
      // has not been migrated is an RPC call PostgREST cannot resolve and a dead submit
      // button — the same trap the token had, so the same rule: never send what the form has
      // not declared it takes.
      var onePer = !!(table.config && table.config.one_per_device);
      var myKey = onePer ? deviceKey() : null;
      submitDevice = myKey;
      var mineReady = (onePer && myKey)
        ? db.rpc("my_signup", { p_slug: slug, p_token: parentToken || null, p_device: myKey })
            .then(function (r) { return (r && !r.error && r.data) ? r.data : null; })
            .catch(function () { return null; })
        : Promise.resolve(null);
      Promise.all([parentReady, slotsReady, mineReady]).then(function (both) {
        var parent = both[0], slots = both[1], mine = both[2];
        if (scoped && !parent) { notFound(); return; }
        if (parent) parent.slots = slots;
        // Where you stand comes before everything else, including "full": somebody who
        // already has a place must never be shown a form or told there is no room.
        var al = alreadyText(mine);
        if (al) {
          document.getElementById("form-title").innerHTML = esc(table.name);
          document.getElementById("head").style.display = "block";
          if (parent) renderParent(parent);
          showClosed(al.head, al.body);
          return;
        }
        db.from("app_fields").select("*").eq("table_id", table.id).order("position", { ascending: true }).then(function (fRes) {
          if (fRes.error) { notFound(); return; }
          var st = slotsText(slots);
          if (st && st.blocked) {
            // The details still show: somebody who arrives late should see WHICH event they
            // missed, not a bare refusal.
            document.getElementById("form-title").innerHTML = esc(table.name);
            document.getElementById("head").style.display = "block";
            renderParent(parent);
            showClosed(slots && !slots.open ? "Not open for signups" : "No places left",
              slots && !slots.open
                ? "This is not taking signups at the moment. Please check with whoever sent you the link."
                : "Every place, including the backup places, has been taken.");
            return;
          }
          init(table, fRes.data || []);
          if (parent) renderParent(parent);
        });
      });
    });
  }
</script>
</body>
</html>
