<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Store Audit · BLK Tables</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --ink:#17150f;--ink2:#57534a;--ink3:#8b8679;
  --ground:#f2f1ee;--surface:#ffffff;--line:#e0ddd6;--sunk:#e9e7e2;
  --accent:#8a5a2b;--accent-ink:#ffffff;
  --pass:#2f7a4a;--pass-bg:#e3f1e7;
  --part:#a56a0c;--part-bg:#fbefd6;
  --fail:#b3362c;--fail-bg:#f8e1de;
  --na:#6d6a62;--na-bg:#e6e4df;
  --sans:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --ink:#eeebe4;--ink2:#b3ada1;--ink3:#857f73;
  --ground:#14130f;--surface:#1d1b17;--line:#34312a;--sunk:#27241f;
  --accent:#c98f55;--accent-ink:#17150f;
  --pass:#6cc58c;--pass-bg:#1b3325;--part:#e3a940;--part-bg:#3a2c12;--fail:#ef7b6f;--fail-bg:#3d1c19;--na:#a39e93;--na-bg:#2c2a25;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:env(safe-area-inset-top,0px) 64px}
.wrap{max-width:880px;margin:0 auto}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
a{color:var(--accent)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:12px 10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-weight:700;letter-spacing:.14em;font-size:15px}
.brand span{color:var(--ink2);font-size:13px}
.scorebox{display:flex;align-items:center;gap:10px}
.score{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.score small{font-size:12px;color:var(--ink3)}
.pill{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;text-align:center}
.g-green{background:var(--pass-bg);color:var(--pass)}
.g-amber{background:var(--part-bg);color:var(--part)}
.g-red{background:var(--fail-bg);color:var(--fail)}
.g-none{background:var(--na-bg);color:var(--na)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 10px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.flags{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.flag{font-size:12px;padding:3px 8px;border-radius:4px;background:var(--sunk);color:var(--ink2)}
.flag.bad{background:var(--fail-bg);color:var(--fail)}
.flag.warn{background:var(--part-bg);color:var(--part)}

.tabs{display:flex;gap:4px;overflow-x:auto;margin-block:16px 12px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.note{margin-block:12px;font-size:13px;color:var(--ink2);border:1px dashed var(--line);border-radius:6px;padding:8px 10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.gate{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px;margin-top:24px}
.gate h2{margin:0 0 8px;font-size:18px}

section.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-block:0 12px}
.card > header{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
.card > header h2{font-size:15px;margin:0;font-weight:600;flex:1;text-wrap:balance}
.card > header .w{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.card > header .dpct{font-family:var(--mono);font-size:13px;font-weight:600;min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.card > header .chev{color:var(--ink3);transition:transform .15s}
.card.closed > header .chev{transform:rotate(-90deg)}
.card.closed .body{display:none}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--sunk);color:var(--ink2)}
.tag.gated{background:var(--fail-bg);color:var(--fail)}
.tag.diag{background:var(--part-bg);color:var(--part)}
.body{border-top:1px solid var(--line)}

.item{padding:10px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.item:last-child{border-bottom:0}
.lbl{display:flex;flex-direction:column;gap:2px}
.lbl .t{font-size:14px}
.lbl .ar{font-size:13px;color:var(--ink2)}
.lbl .m{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--ink3);font-family:var(--mono);flex-wrap:wrap}
.sev-critical{color:var(--fail);font-weight:600}
.rate{display:inline-flex;gap:4px}
.rate button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 0;width:56px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink2)}
.rate button[data-p="2"][aria-pressed="true"]{background:var(--pass-bg);border-color:var(--pass);color:var(--pass)}
.rate button[data-p="1"][aria-pressed="true"]{background:var(--part-bg);border-color:var(--part);color:var(--part)}
.rate button[data-p="0"][aria-pressed="true"]{background:var(--fail-bg);border-color:var(--fail);color:var(--fail)}
.rate button[data-p="na"][aria-pressed="true"]{background:var(--na-bg);border-color:var(--na);color:var(--na)}
.rate button:disabled{opacity:.45;cursor:not-allowed}
.evid{grid-column:1/-1;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
.photo{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);border:1px dashed var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;white-space:nowrap}
.photo.req{border-color:var(--fail);color:var(--fail)}
.photo.ok{border-style:solid;border-color:var(--pass);color:var(--pass)}
.photo input{display:none}
.photos{grid-column:1/-1;font-size:12px;color:var(--ink2);display:flex;gap:8px;align-items:center}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:12px;text-decoration:underline}
.miss{outline:2px solid var(--fail);outline-offset:-2px}

.fields{padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px}
.f > label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:500}
.f .hint{font-size:11px;color:var(--ink3)}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
input[readonly]{background:var(--sunk);color:var(--ink2)}
textarea{resize:vertical;min-height:40px}
.full{grid-column:1/-1}
.lock{padding:12px 14px;color:var(--ink3);font-size:13px;margin:0}
.num{width:110px}

.submit{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:6px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6;cursor:progress}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.msg{font-size:13px}
.msg.bad{color:var(--fail)}
.msg.ok{color:var(--pass)}

.sheet{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:20px}
.sheet .head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.sheet h3{margin:0;font-size:20px;text-wrap:balance}
.sheet .sub{color:var(--ink2);font-size:13px}
.big{display:flex;align-items:center;gap:12px}
.big .n{font-family:var(--mono);font-size:40px;font-weight:600;line-height:1}
.route{font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
.route dt{color:var(--ink3);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.route dd{margin:0}
.h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600;margin:0 0 8px}
.dbars{display:grid;gap:6px}
.dbar{display:grid;grid-template-columns:170px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.dbar .track{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.dbar .fill{height:100%;border-radius:4px}
.dbar .v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.dbar.nc{color:var(--ink3)}
.findings{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.findings li{display:grid;grid-template-columns:68px 1fr;gap:10px;font-size:13px;align-items:start}
.findings .nt{color:var(--ink2)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.txt{font-size:13px;white-space:pre-wrap}
.empty{color:var(--ink3);font-size:13px;margin:0}
.feed{border-top:1px dashed var(--line);padding-top:16px}
.pdfhost{position:fixed;left:-10000px;top:0;width:794px}
.pdfhost .sheet{--ink:#17150f;--ink2:#57534a;--ink3:#8b8679;--surface:#ffffff;--line:#e0ddd6;--sunk:#e9e7e2;--pass:#2f7a4a;--pass-bg:#e3f1e7;--part:#a56a0c;--part-bg:#fbefd6;--fail:#b3362c;--fail-bg:#f8e1de;--na:#6d6a62;--na-bg:#e6e4df;border:0;border-radius:0}

/* round 2 */
:root{--s1:#3b6fb6;--s2:#2f7a4a;--s3:#a5562c;--s4:#7a4fa6;--s5:#b0367a;--s6:#2c8a8a;--cell:#f7f6f3;--station:#efe6da;--accent-bg:#f3e8dc}
@media (prefers-color-scheme:dark){:root{--s1:#7aa6e6;--s2:#6cc58c;--s3:#e09468;--s4:#b691e0;--s5:#e57ab4;--s6:#6cc8c8;--cell:#211f1a;--station:#3a3125;--accent-bg:#33271b}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.hint{font-size:13px;color:var(--ink2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin-block:0 12px}
.panel h2{font-size:16px;margin:0 0 4px}
.ctx{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.ctx.col{flex-direction:column;align-items:stretch}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{background:none;color:var(--fail);border:1px solid var(--line)}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-block:0 14px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13px;color:var(--ink2)}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.tag.bad{background:var(--fail-bg);color:var(--fail)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:600;background:var(--sunk)}
.tbl tr:last-child td{border-bottom:0}
.tbl td input,.tbl td select{padding:5px 7px;font-size:13px;min-width:130px}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 8px;border-radius:99px;background:var(--sunk)}
.chip button{border:0;background:none;cursor:pointer;color:var(--ink3);padding:0 0 0 2px;font-size:14px;line-height:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
.scrim{position:fixed;inset:0;background:rgba(10,9,7,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:var(--surface);border-radius:10px;max-width:460px;width:100%;padding:20px;display:grid;gap:14px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal h3{margin:0;font-size:17px;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opts button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 4px;cursor:pointer;font-weight:600;font-size:13px}
.opts button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.opts.n{grid-template-columns:repeat(5,1fr)}
.found{font-size:13px;padding:10px;border-radius:6px}
.found.ok{background:var(--pass-bg);color:var(--pass)}
.found.none{background:var(--part-bg);color:var(--part)}
.pbwrap{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.pbside{flex:1 1 240px;max-width:300px}
.pbmain{flex:3 1 520px;min-width:0}
.plist{display:grid;gap:6px}
.pitem{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer}
.pitem[aria-current="true"]{border-color:var(--accent);background:var(--accent-bg)}
.pitem .m{font-size:12px;color:var(--ink2)}
.pbhead{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.mode{font-size:13px;padding:8px 10px;border-radius:6px;background:var(--accent-bg);color:var(--accent);margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.canvaswrap{overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(14,40px);grid-template-rows:repeat(9,40px);gap:2px;background:var(--line);border:2px solid var(--line);border-radius:6px;width:max-content;user-select:none}
.cell{background:var(--cell);cursor:pointer}
.cell:hover{background:var(--sunk)}
.cell.start{outline:2px solid var(--accent);outline-offset:-2px}
.st{background:var(--station);border:2px solid var(--ink3);border-radius:4px;padding:3px 5px;font-size:11px;font-weight:600;color:var(--ink2);z-index:1;cursor:pointer;overflow:hidden}
.st.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.who{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;z-index:2;align-self:center;justify-self:center;pointer-events:none;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.staff{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:14px}
.scard{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px}
.scard .top{display:flex;gap:8px;align-items:center}
.scard .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dot{width:26px;height:26px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.spark{display:inline-block;vertical-align:middle}

@media (max-width:560px){
  .grid{grid-template-columns:repeat(14,30px);grid-template-rows:repeat(9,30px)}
  .who{width:24px;height:24px;font-size:11px}
  .item{grid-template-columns:1fr}
  .rate{width:100%}
  .rate button{flex:1;width:auto}
  .evid{grid-template-columns:1fr}
  .dbar{grid-template-columns:110px 1fr 60px}
  .sheet{padding:16px}
  .big .n{font-size:32px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="brand"><b>BLK</b><span>Store Audit</span></div>
    <div class="scorebox" id="scorebox" hidden>
      <div class="score"><span id="score">--</span><small>/100</small></div>
      <span id="grade" class="pill g-none">--</span>
    </div>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="ar" aria-pressed="false">ع</button>
      <button type="button" data-lang="both" aria-pressed="false">Both</button>
    </div>
    <div class="flags" id="flags"></div>
  </div>

  <div id="gate" class="gate"><h2>Loading</h2><p>Checking your sign-in.</p></div>

  <div id="app" hidden>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="audit" aria-selected="true">Audit</button>
      <button type="button" role="tab" data-tab="report" aria-selected="false">One-pager</button>
      <button type="button" role="tab" data-tab="playbook" aria-selected="false">Playbook</button>
      <button type="button" role="tab" data-tab="history" aria-selected="false">History</button>
      <button type="button" role="tab" data-tab="settings" aria-selected="false" hidden>Settings</button>
    </div>
    <div id="draftnote" class="note" hidden></div>
    <div id="tab-audit"></div>
    <div id="tab-report" hidden></div>
    <div id="tab-playbook" hidden></div>
    <div id="tab-history" hidden></div>
    <div id="tab-settings" hidden></div>
  </div>

  <div id="done" class="gate" hidden></div>
  <div class="pdfhost" id="pdfhost" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status"></div>
  <div id="modal"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3" integrity="sha384-l8ah+VgaWtk1mvOe9VC+OirC6qHFF4yH7l7mKRidV9MSti3E9F463bMp6ZVN4kuC" crossorigin="anonymous"></script>
<script>
  var SUPABASE_URL = "https://db.blktable.blk.jo";
  var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg0NzExNjYwLCJleHAiOjIxMDAwNzE2NjB9.jve2CB0Dt8dESno2dgVHu5kcLnmCE-fISi0TYT_prwc";
  var DRAFT_KEY = "blk-store-audit-draft-v1";
  var LIBS = [
    ["https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js", "sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H"],
    ["https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js", "sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk"]
  ];
  var db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

  var CAT = { domains: [], items: [], byCode: {}, byDomain: {}, branches: [], profiles: {}, areas: [], plans: [], users: [] };
  var S = { ans: {}, notes: {}, photos: {}, autoNA: {}, closed: {}, lang: "en", uploading: 0, prior: null, busy: false, role: null };

  // ---- scoring: mirror of public.audit_score (audit-03-score.sql). The DB result is what is saved. ----
  function auditPoints(v) {
    if (v === "Pass" || v === "Yes") return 2;
    if (v === "Partial") return 1;
    if (v === "Fail" || v === "No") return 0;
    return null;
  }
  function auditScore(ans, domains, items) {
    ans = ans || {};
    var tot = 0, w = 0, dom = {}, crit = [];
    var scored = domains.filter(function (d) { return d.scored; }).sort(function (a, b) { return a.position - b.position; });
    scored.forEach(function (d) {
      var pts = 0, n = 0;
      items.forEach(function (i) {
        if (i.domain !== d.key || (i.kind !== "rating" && i.kind !== "yesno")) return;
        var p = auditPoints(ans[i.code]);
        if (p === null) return;
        pts += p; n++;
      });
      if (n > 0) { dom[d.key] = pts / (2 * n); tot += pts / (2 * n) * d.weight; w += d.weight; }
      else dom[d.key] = null;
    });
    var pos = {};
    domains.forEach(function (d) { pos[d.key] = d.position; });
    items.filter(function (i) { return i.tier === "critical" && auditPoints(ans[i.code]) === 0; })
      .sort(function (a, b) { return (pos[a.domain] - pos[b.domain]) || (a.position - b.position); })
      .forEach(function (i) { crit.push(i.code); });
    var sp = 0, sn = 0, spotFail = false;
    items.forEach(function (i) {
      if (i.domain !== "spots") return;
      var p = auditPoints(ans[i.code]);
      if (p === null) return;
      sp += p; sn++;
      if (p === 0) spotFail = true;
    });
    var deep = spotFail || (sn > 0 && sp / (2 * sn) < 0.75);
    var cal = ans.c7 === "Partial" || ans.c7 === "Fail";
    var score = null, grade = null;
    if (w > 0) {
      score = Math.round(tot / w * 1000 + 1e-9) / 10;
      grade = score >= 90 ? "Green" : score >= 75 ? "Amber" : "Red";
      if (spotFail && grade === "Green") grade = "Amber";
      if (crit.length) grade = "Red";
    }
    return { score: score, grade: grade, domains: dom, critical_fails: crit, spot_pts: sp, spot_max: 2 * sn,
             spot_fail: spotFail, deep_clean: deep, calibration: cal };
  }
  // Which items the auditor still owes before submit. Mirrors store_audit_submit's evidence rule
  // (Partial = note, Fail = note + photo) and adds completeness, which only the page checks.
  function auditMissing(ans, notes, photos, items, res, dtLocked) {
    var out = [];
    var req = { h_store: 1, h_market: 1, h_auditor: 1, h_date: 1, h_visit_type: 1, c7_drink: 1 };
    var needRate = { craft: 1, station: 1, safety: 1, ops: 1, systems: 1, orchestra: 1, brand: 1, core: 1, people: 1, spots: 1, comp: 1 };
    if (res.calibration) needRate.cal = 1;
    if (res.deep_clean) needRate.deep = 1;
    items.forEach(function (i) {
      var v = ans[i.code];
      var blank = v === undefined || v === null || String(v).trim() === "";
      if (req[i.code] && blank) { out.push({ code: i.code, why: "answer" }); return; }
      if (i.kind !== "rating" && i.kind !== "yesno") return;
      if (i.code === "sup_qc") return;
      if (!needRate[i.domain]) return;
      if (dtLocked && i.dt) return;
      if (blank) { out.push({ code: i.code, why: "rating" }); return; }
      var p = auditPoints(v);
      if ((p === 0 || p === 1) && !String(notes[i.code] || "").trim()) out.push({ code: i.code, why: "note" });
      if (p === 0 && !(photos[i.code] || []).length) out.push({ code: i.code, why: "photo" });
    });
    return out;
  }
  // What goes to the server: stage 2 answers only while that stage is open, evidence only for
  // items still below Pass, so a note left behind on an item later set to Pass is not stored.
  function auditPayload(ans, notes, photos, items, res) {
    var a = {}, n = {}, ph = {};
    items.forEach(function (i) {
      if (i.kind === "computed" || i.code === "h_prior") return;
      if (i.domain === "cal" && !res.calibration) return;
      if (i.domain === "deep" && !res.deep_clean) return;
      if (i.code === "sup_qc_note" && ans.sup_qc !== "Yes") return;
      var v = ans[i.code];
      if (v === undefined || v === null || String(v).trim() === "") return;
      a[i.code] = String(v).trim();
      var p = auditPoints(a[i.code]);
      if (p === 0 || p === 1) {
        if (String(notes[i.code] || "").trim()) n[i.code] = String(notes[i.code]).trim();
        if ((photos[i.code] || []).length) ph[i.code] = photos[i.code].slice();
      }
    });
    return { answers: a, notes: n, photos: ph };
  }

  // ---- PDF: the one-pager rendered to an image, so Arabic shapes correctly without PDF fonts ----
  async function buildPdf(res, ans, notes, prof) {
    for (var k = 0; k < LIBS.length; k++) await loadScript(LIBS[k][0], LIBS[k][1]);
    var host = $("#pdfhost");
    host.innerHTML = reportHtml(res, ans, notes, prof);
    try {
      var canvas = await window.html2canvas(host.firstElementChild, { scale: 2, backgroundColor: "#ffffff", useCORS: true });
      var pdf = new window.jspdf.jsPDF({ unit: "pt", format: "a4" });
      var pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
      var sliceH = Math.floor(canvas.width * ph / pw);
      for (var y = 0, page = 0; y < canvas.height; y += sliceH, page++) {
        var part = document.createElement("canvas");
        part.width = canvas.width; part.height = Math.min(sliceH, canvas.height - y);
        part.getContext("2d").drawImage(canvas, 0, y, canvas.width, part.height, 0, 0, canvas.width, part.height);
        if (page) pdf.addPage();
        pdf.addImage(part.toDataURL("image/jpeg", 0.9), "JPEG", 0, 0, pw, part.height * pw / canvas.width);
      }
      return pdf.output("blob");
    } finally { host.innerHTML = ""; }
  }

  // ---- submit ----
  function setMsg(text, cls) { var m = $("#msg"); if (m) { m.className = "msg " + (cls || ""); m.textContent = text; } }
  async function submit() {
    if (S.busy) return;
    document.querySelectorAll(".miss").forEach(function (x) { x.classList.remove("miss"); });
    var res = result();
    var miss = auditMissing(S.ans, S.notes, S.photos, CAT.items, res, dtLocked());
    if (miss.length) {
      miss.forEach(function (m) { var r = document.getElementById("row-" + m.code) || (document.getElementById("in-" + m.code) || {}).parentElement; if (r) r.classList.add("miss"); });
      var c = function (w) { return miss.filter(function (m) { return m.why === w; }).length; };
      var parts = [];
      if (c("answer")) parts.push(c("answer") + " header answer" + (c("answer") > 1 ? "s" : ""));
      if (c("rating")) parts.push(c("rating") + " not rated");
      if (c("note")) parts.push(c("note") + " missing a note");
      if (c("photo")) parts.push(c("photo") + " Fail" + (c("photo") > 1 ? "s" : "") + " missing a photo");
      setMsg("Not sent yet: " + parts.join(", ") + ". Marked in red.", "bad");
      var first = document.getElementById("row-" + miss[0].code) || document.getElementById("in-" + miss[0].code);
      if (first) {
        var card = first.closest(".card");
        if (card && card.classList.contains("closed")) { card.classList.remove("closed"); S.closed[card.getAttribute("data-card")] = false; }
        first.scrollIntoView({ behavior: "smooth", block: "center" });
      }
      return;
    }
    if (S.uploading > 0) return setMsg("Photos are still uploading. Submit again in a moment.", "bad");
    S.busy = true;
    var btn = $("#submit"); btn.disabled = true;
    setMsg("Saving the visit");
    var pl = auditPayload(S.ans, S.notes, S.photos, CAT.items, res);
    var r = await db.rpc("store_audit_submit", { p_answers: pl.answers, p_notes: pl.notes, p_photos: pl.photos });
    if (r.error) {
      S.busy = false; btn.disabled = false;
      return setMsg("Not saved: " + r.error.message + ". Your answers are kept on this device; try again.", "bad");
    }
    clearDraft();
    var id = r.data.id, sres = r.data.result || res, prof = currentProfile();
    setMsg("Visit saved. Building the report card");
    var path = null, url = null, pdfErr = null;
    try {
      var blob = await buildPdf(sres, pl.answers, pl.notes, prof);
      var name = ("store-audit-" + pl.answers.h_store + "-" + pl.answers.h_date).replace(/[^a-zA-Z0-9._-]+/g, "-") + ".pdf";
      path = await storageUpload(new File([blob], name, { type: "application/pdf" }));
      url = await signForEmail(path);
    } catch (e) { pdfErr = e.message || String(e); }
    await sendVisit(id, path, url, pdfErr, sres, pl.answers);
    S.busy = false;
  }
  // The drain sends with no user session and R2 only presigns for a signed-in user, so the link
  // Resend fetches the PDF from is signed here, for the 24h maximum the r2 function allows.
  async function signForEmail(path) {
    var sess = await db.auth.getSession();
    var tok = sess.data && sess.data.session && sess.data.session.access_token;
    var r = await fetch(SUPABASE_URL + "/functions/v1/r2/sign", {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + tok, "Content-Type": "application/json" },
      body: JSON.stringify({ path: path, ttl: 86400 })
    });
    var j = await r.json().catch(function () { return {}; });
    if (!r.ok || !j.url) throw new Error("could not sign the PDF link (" + (j.error || r.status) + ")");
    return j.url;
  }

        return;
      }
      if (PB.mode === "place" && cell) {
        PB.undo.push(["staff", JSON.stringify(p.staff)]);
        p.staff[PB.placing].x = +cell.getAttribute("data-c"); p.staff[PB.placing].y = +cell.getAttribute("data-r");

        PB.selSt = hit ? hit.id : null; renderPlaybook();
      }
    };

    var cn = $("#pb-cancel"); if (cn) cn.onclick = function () { PB.mode = null; PB.start = null; PB.placing = null; renderPlaybook(); };

    var ds = $("#pb-delst"); if (ds) ds.onclick = function () { PB.undo.push(["stations", JSON.stringify(p.stations)]); p.stations = p.stations.filter(function (x) { return x.id !== PB.selSt; }); PB.selSt = null; renderPlaybook(); };

    document.querySelectorAll("[data-sf]").forEach(function (inp) { inp.oninput = function () { p.staff[+inp.getAttribute("data-i")][inp.getAttribute("data-sf")] = inp.value; }; });

    $("#pb-store").onchange = function (e) { p.branch_id = e.target.value; };
    $("#pb-shift").onchange = function (e) { p.shift = e.target.value; };

  async function pbSave(p, quiet) {

    await loadPlans();
    PB.draft = clonePlan(CAT.plans.filter(function (x) { return x.id === r.data.id; })[0]);
    PB.undo = []; PB.kept = [];

  async function renderHistory() {
    var el = $("#tab-history");
    el.innerHTML = '<div class="gate" style="margin:0">Loading visits</div>';
    var r = await db.rpc("store_audit_history");
    if (r.error) { el.innerHTML = '<div class="gate" style="margin:0">Could not load visits: ' + esc(r.error.message) + "</div>"; return; }
    var by = {};
    (r.data || []).forEach(function (v) { (by[v.branch] = by[v.branch] || []).push(v); });
    var today = new Date(todayIso());
    var rows = CAT.branches.map(function (b) {
      var v = by[b.name] || [], last = v[v.length - 1];
      return { b: b, v: v, last: last, days: last ? Math.round((today - new Date(last.date)) / 864e5) : null };
    }).sort(function (a, b) { return (b.days == null ? 1e6 : b.days) - (a.days == null ? 1e6 : a.days); });
    var over = rows.filter(function (x) { return x.days == null || x.days > 30; }).length;
    el.innerHTML = '<div class="panel"><h2>Visit history</h2><p class="hint">' + over + " of " + rows.length + " stores have no visit in the last 30 days. Longest gap first.</p>" +
      '<div class="tbl"><table><thead><tr><th>Store</th><th>Market</th><th>Last visit</th><th>Days since</th><th>Last grade</th><th>Trend</th><th>Visits</th></tr></thead><tbody>' +
      rows.map(function (x) {
        var p = CAT.profiles[x.b.id] || {};
        return "<tr><td>" + esc(x.b.name) + "</td><td>" + esc(p.market || "") + '</td><td class="num">' + (x.last ? esc(x.last.date) : "never") + "</td>" +
          '<td class="num">' + (x.days == null ? "--" : x.days) + (x.days == null || x.days > 30 ? ' <span class="tag bad">overdue</span>' : "") + "</td>" +
          "<td>" + (x.last && x.last.grade ? '<span class="pill ' + gradeClass(x.last.grade) + '">' + esc(x.last.grade) + '</span> <span class="num">' + Number(x.last.score).toFixed(1) + "</span>" : "") + "</td>" +
          "<td>" + sparkSvg(x.v.map(function (v) { return Number(v.score); }).filter(function (n) { return !isNaN(n); })) + '</td><td class="num">' + x.v.length + "</td></tr>";
      }).join("") + "</tbody></table></div></div>";
  }
  function sparkSvg(vals) {
    if (vals.length < 2) return "";
    var w = 80, h = 22, lo = 60, hi = 100;
    function x(i) { return 2 + i * (w - 4) / (vals.length - 1); }
    function y(v) { return h - 2 - (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo) * (h - 4); }
    return '<svg class="spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + " " + h + '" aria-hidden="true"><line x1="0" x2="' + w + '" y1="' + y(90) + '" y2="' + y(90) + '" stroke="var(--line)" stroke-dasharray="2 2"/>' +
      '<polyline fill="none" stroke="var(--accent)" stroke-width="1.6" points="' + vals.map(function (v, i) { return x(i) + "," + y(v); }).join(" ") + '"/>' +
      '<circle cx="' + x(vals.length - 1) + '" cy="' + y(vals[vals.length - 1]) + '" r="2.5" fill="var(--accent)"/></svg>';
  }

      var r = await db.from("area_leaders").insert({ name: "New area leader" }).select().single();
      if (r.error) return toast("Not added: " + r.error.message);
      CAT.areas.push(r.data); return renderSettings();
    }
    var as = t.closest("[data-assign]");
    if (as) { var v = $("#assign-" + as.getAttribute("data-assign")).value; if (!v) return; await saveProfile(v, { area_leader_id: as.getAttribute("data-assign") }); return renderSettings(); }
    var un = t.closest("[data-unassign]"); if (un) { await saveProfile(un.getAttribute("data-unassign"), { area_leader_id: null }); return renderSettings(); }
    var da = t.closest("[data-delarea]");
    if (da) {
      var id = da.getAttribute("data-delarea");
      var d = await db.from("area_leaders").delete().eq("id", id);
      if (d.error) return toast("Not removed: " + d.error.message);
      CAT.areas = CAT.areas.filter(function (a) { return a.id !== id; });
      Object.keys(CAT.profiles).forEach(function (k) { if (CAT.profiles[k].area_leader_id === id) CAT.profiles[k].area_leader_id = null; });
      toast("Removed. Its branches now have no area leader"); return renderSettings();
    }
    var am = t.closest("[data-addmail]");
    if (am) {
      var m = am.getAttribute("data-addmail"), em = $("#mail-" + m).value.trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return toast("Enter a full email address");
      var ins = await db.from("audit_market_recipients").insert({ market: m, email: em });
      if (ins.error) return toast("Not added: " + ins.error.message);
      return renderSettings();
    }
    var umm = t.closest("[data-unmail]");
    if (umm) {
      var parts = umm.getAttribute("data-unmail").split("|");
      var dm = await db.from("audit_market_recipients").delete().eq("market", parts[0]).eq("email", parts[1]);
      if (dm.error) return toast("Not removed: " + dm.error.message);
      return renderSettings();
    }
    var ua = t.closest("[data-unaud]");
    if (ua || t.id === "aud-add") {
      var list = ((CAT.byCode.h_auditor && CAT.byCode.h_auditor.choices) || []).slice();
      if (ua) list.splice(+ua.getAttribute("data-unaud"), 1);
      else { var nm = $("#aud-new").value.trim(); if (!nm || list.indexOf(nm) >= 0) return; list.push(nm); }
      var up = await db.from("audit_items").update({ choices: list }).eq("code", "h_auditor");
      if (up.error) return toast("Not saved: " + up.error.message);
      CAT.byCode.h_auditor.choices = list; toast("Saved"); return renderSettings();
    }
    if (t.id === "flip") return setConfig(!(SET.cfg && SET.cfg.send_live === true));
    if (t.id === "cfg-save") return setConfig(SET.cfg && SET.cfg.send_live === true);
  }
  async function settingsChange(e) {
    var el = e.target;
    if (el.hasAttribute("data-sp")) {
      var k = el.getAttribute("data-k"), v = el.value === "" ? null : el.value;
      if (k === "drive_thru") v = v === null ? null : v === "true";
      var patch = {}; patch[k] = typeof v === "string" ? v.trim() || null : v;
      await saveProfile(el.getAttribute("data-sp"), patch);
      if (k === "ownership") renderSettings();
      return;
    }
    if (el.hasAttribute("data-al")) {
      var id = el.getAttribute("data-al"), key = el.getAttribute("data-k"), p2 = {};
      p2[key] = el.value.trim() || null;
      if (key === "name" && !p2.name) return toast("An area leader needs a name");
      var r = await db.from("area_leaders").update(p2).eq("id", id).select().single();
      if (r.error) return toast("Not saved: " + r.error.message);
      CAT.areas = CAT.areas.map(function (a) { return a.id === id ? r.data : a; }); toast("Saved");
      return;
    }
    if (el.hasAttribute("data-lab")) {
      var code = el.getAttribute("data-lab"), lk = el.getAttribute("data-k"), p3 = {};
      p3[lk] = el.value.trim() || (lk === "label" ? CAT.byCode[code].label : null);
      var u = await db.from("audit_items").update(p3).eq("code", code);
      if (u.error) return toast("Not saved: " + u.error.message);
      CAT.byCode[code][lk] = p3[lk]; toast("Saved");
    }
  }

  // ---- events ----
  function showTab(k) {
    document.querySelectorAll("[data-tab]").forEach(function (x) { x.setAttribute("aria-selected", String(x.getAttribute("data-tab") === k)); });
    ["audit", "report", "playbook", "history", "settings"].forEach(function (n) { $("#tab-" + n).hidden = n !== k; });
    $("#draftnote").hidden = k !== "audit" || !$("#draftnote").innerHTML;
    if (k === "report") renderReport();
    if (k === "playbook") renderPlaybook();
    if (k === "history") renderHistory();
    if (k === "settings") renderSettings();
    window.scrollTo({ top: 0 });
  }
  document.addEventListener("click", function (e) {
    if (e.target.closest("#tab-settings")) { settingsClick(e); return; }
    var op = e.target.closest("[data-openplan]");
    if (op) { PB.draft = clonePlan(CAT.plans.filter(function (x) { return x.id === op.getAttribute("data-openplan"); })[0]); PB.undo = []; PB.kept = []; return showTab("playbook"); }
    if (e.target.id === "reshift") return shiftModal();
    var ps = e.target.closest("[data-sel]");
    if (ps) { PB.draft = clonePlan(CAT.plans.filter(function (x) { return x.id === ps.getAttribute("data-sel"); })[0]); PB.mode = null; PB.selSt = null; PB.undo = []; PB.kept = []; return renderPlaybook(); }
    if (e.target.id === "pb-new") {
      var first = CAT.branches.filter(function (b) { return canEditBranch(b.id); })[0];
      if (!first) return;
      PB.draft = { id: null, branch_id: first.id, name: "New plan", shift: "A", headcount: 3, stations: [], staff: [emptySeat(), emptySeat(), emptySeat()] };
      PB.mode = null; PB.selSt = null; PB.undo = []; PB.kept = []; return renderPlaybook();
    }
    var b = e.target.closest(".rate button");
    if (b && !b.disabled) {
      var code = b.getAttribute("data-code"), v = b.getAttribute("data-v");
      var before = result();
      if (S.ans[code] === v) delete S.ans[code]; else S.ans[code] = v;
      delete S.autoNA[code];
      saveDraft();
      var after = result();
      if (before.calibration !== after.calibration || before.deep_clean !== after.deep_clean || code === "sup_qc") {
        var y = window.scrollY; renderAll(); window.scrollTo({ top: y }); return;
      }
      rerenderRow(code); refreshScores(); return;
    }
    var up = e.target.closest("[data-unphoto]");
    if (up) { var c = up.getAttribute("data-unphoto"); (S.photos[c] || []).pop(); saveDraft(); rerenderRow(c); return; }
    var tg = e.target.closest("[data-toggle]");
    if (tg) { var k = tg.getAttribute("data-toggle"); S.closed[k] = !S.closed[k]; tg.parentElement.classList.toggle("closed"); return; }
    var tab = e.target.closest("[data-tab]");
    if (tab) return showTab(tab.getAttribute("data-tab"));
    var lb = e.target.closest("[data-lang]");
    if (lb) {
      S.lang = lb.getAttribute("data-lang");
      document.querySelectorAll("[data-lang]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === lb)); });
      if (CAT.items.length) renderAll();
      return;
    }
    if (e.target.id === "toReport") return showTab("report");
    if (e.target.id === "submit") return submit();
    if (e.target.id === "discard") {
      clearDraft(); S.ans = { h_date: todayIso() }; S.notes = {}; S.photos = {}; S.autoNA = {}; S.prior = null;
      $("#draftnote").hidden = true; renderAll();
    }
  });
  document.addEventListener("input", function (e) {
    var el = e.target;
    if (el.closest("#tab-settings") || el.closest("#tab-playbook")) return;
    if (el.hasAttribute("data-note")) { S.notes[el.getAttribute("data-note")] = el.value; saveDraft(); return; }
    if (el.hasAttribute("data-code") && el.tagName !== "SELECT") { S.ans[el.getAttribute("data-code")] = el.value; saveDraft(); }
  });
  document.addEventListener("change", function (e) {
    var el = e.target;
    if (el.closest("#tab-settings")) { settingsChange(e); return; }
    if (el.closest("#tab-playbook")) return;
    if (el.hasAttribute("data-photo")) {
      var code = el.getAttribute("data-photo"), files = Array.prototype.slice.call(el.files || []);
      if (!files.length) return;
      var lab = el.parentElement; lab.lastChild.textContent = "Uploading " + files.length;
      S.uploading += files.length;
      files.forEach(function (f) {
        storageUpload(f).then(function (p) {
          (S.photos[code] = S.photos[code] || []).push(p); saveDraft();
        }).catch(function (err) {
          setMsg("A photo did not upload for " + code + ": " + err.message + ". Add it again.", "bad");
        }).then(function () { S.uploading--; rerenderRow(code); });
      });
      return;
    }
    if (el.hasAttribute("data-code") && (el.tagName === "SELECT" || el.type === "date")) {
      var c = el.getAttribute("data-code");
      if (el.value) S.ans[c] = el.value; else delete S.ans[c];
      if (c === "h_store") { applyStore(); saveDraft(); var y = window.scrollY; renderAll(); window.scrollTo({ top: y }); loadPrior(); if (S.ans.h_store) shiftModal(); return; }
      saveDraft();
    }
  });
  boot();
</script>
</body>
